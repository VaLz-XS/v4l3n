<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil // v4l3n</title>
<style>
  :root {
    --bg: #0a0a0c;
    --panel: rgba(18, 15, 12, 0.75);
    --border: rgba(255, 215, 0, 0.15);
    --gold: #d4af37;
    --gold-soft: #e8c87a;
    --gold-dim: #8a7020;
    --gold-glow: rgba(212, 175, 55, 0.3);
    --text: #ece8e0;
    --muted: #8a8070;
    --font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .dash-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image: url('assets/tenka-bg.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }

  .dash-overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: linear-gradient(180deg,
      rgba(10, 8, 6, 0.65) 0%,
      rgba(10, 8, 6, 0.5) 40%,
      rgba(10, 8, 6, 0.85) 100%);
    pointer-events: none;
  }

  .wrap {
    position: relative;
    z-index: 2;
    max-width: 500px;
    margin: 0 auto;
    padding: 20px 16px 120px;
  }

  .profil-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .profil-header h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .back-btn {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: rgba(25, 20, 15, 0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: all 0.25s ease;
  }
  .back-btn:hover {
    background: rgba(45, 38, 25, 0.8);
    border-color: var(--gold-dim);
  }
  .back-btn svg {
    width: 20px; height: 20px;
    stroke: var(--text);
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .profil-sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .card {
    background: var(--panel);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 14px;
  }
  .card h3 {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--gold-soft);
  }
  .card h3 svg {
    width: 16px; height: 16px;
    stroke: var(--gold-soft);
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Profile main */
  .profile-main {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }
  .profile-avatar-lg {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, #d4af37, #e8c87a);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 800;
    color: #1a1408;
    flex-shrink: 0;
    box-shadow: 0 0 30px var(--gold-glow);
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }
  .profile-avatar-lg:hover {
    transform: scale(1.05);
    box-shadow: 0 0 40px var(--gold-glow);
  }
  .profile-avatar-lg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }
  .profile-avatar-lg .edit-badge {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--bg);
    z-index: 2;
  }
  .profile-avatar-lg .edit-badge svg {
    width: 12px; height: 12px;
    stroke: #1a1408;
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .profile-info-lg {
    flex: 1;
    min-width: 0;
  }
  .profile-name-lg {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .profile-name-lg .edit-icon {
    display: inline-flex;
  }
  .profile-name-lg .edit-icon svg {
    width: 14px; height: 14px;
    stroke: var(--muted);
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .profile-level-lg {
    display: inline-block;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    background: rgba(212, 175, 55, 0.15);
    color: var(--gold-soft);
    border: 1px solid rgba(212, 175, 55, 0.3);
    border-radius: 6px;
  }

  /* XP Bar */
  .xp-bar-wrap {
    margin-bottom: 20px;
  }
  .xp-bar-label {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .xp-bar-label .val {
    color: var(--gold-soft);
    font-weight: 700;
  }
  .xp-bar {
    width: 100%;
    height: 8px;
    background: rgba(255, 215, 0, 0.1);
    border-radius: 4px;
    overflow: hidden;
  }
  .xp-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--gold), var(--gold-soft));
    box-shadow: 0 0 15px var(--gold-glow);
    transition: width 0.6s ease;
    border-radius: 4px;
  }

  /* Stats grid */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .stat-item {
    background: rgba(10, 8, 6, 0.6);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 8px;
    text-align: center;
  }
  .stat-item .icon-svg {
    width: 26px;
    height: 26px;
    margin: 0 auto 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stat-item .icon-svg svg {
    width: 26px; height: 26px;
    stroke: var(--gold-soft);
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 6px var(--gold-glow));
  }
  .stat-item .val {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 800;
    color: var(--gold-soft);
    margin-bottom: 2px;
  }
  .stat-item .label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Daily */
  .daily-btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #d4af37, #e8c87a);
    color: #1a1408;
    border: none;
    border-radius: 14px;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .daily-btn svg {
    width: 18px; height: 18px;
    stroke: #1a1408;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .daily-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(212, 175, 55, 0.5);
  }
  .daily-btn:disabled {
    background: rgba(40, 35, 28, 0.6);
    color: var(--muted);
    box-shadow: none;
    cursor: not-allowed;
  }
  .daily-btn:disabled svg { stroke: var(--muted); }
  .daily-info {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    font-family: var(--mono);
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.show {
    display: flex;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .modal {
    background: var(--panel);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    animation: slideUp 0.3s ease;
    max-height: 90vh;
    overflow-y: auto;
  }
  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal h3 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
    text-align: center;
    color: var(--gold-soft);
  }

  .modal input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    background: rgba(10, 8, 6, 0.7);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    outline: none;
    margin-bottom: 14px;
  }
  .modal input[type="text"]:focus {
    border-color: var(--gold-dim);
  }

  .modal-actions {
    display: flex;
    gap: 10px;
  }
  .modal-btn {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .modal-btn svg {
    width: 16px; height: 16px;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .modal-btn.primary {
    background: linear-gradient(135deg, #d4af37, #e8c87a);
    color: #1a1408;
  }
  .modal-btn.primary svg { stroke: #1a1408; }
  .modal-btn.secondary {
    background: rgba(25, 20, 15, 0.8);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .modal-btn.secondary svg { stroke: var(--text); }
  .modal-btn:hover {
    transform: translateY(-2px);
  }

  /* Upload area */
  .upload-area {
    border: 2px dashed var(--border);
    border-radius: 14px;
    padding: 24px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    margin-bottom: 14px;
  }
  .upload-area:hover {
    border-color: var(--gold-dim);
    background: rgba(212, 175, 55, 0.05);
  }
  .upload-area svg {
    width: 40px;
    height: 40px;
    stroke: var(--gold-soft);
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    margin-bottom: 10px;
  }
  .upload-area p {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .upload-area span {
    font-size: 11px;
    color: var(--muted);
  }
  .upload-area input[type="file"] {
    display: none;
  }

  /* Avatar preview */
  .avatar-preview {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    margin: 0 auto 14px;
    background: rgba(10, 8, 6, 0.6);
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .avatar-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .avatar-preview svg {
    width: 40px;
    height: 40px;
    stroke: var(--muted);
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Achievement */
  .achievement-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .achievement-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: rgba(10, 8, 6, 0.6);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: all 0.25s ease;
  }
  .achievement-item.locked { opacity: 0.4; }
  .achievement-item.unlocked {
    border-color: rgba(212, 175, 55, 0.4);
    background: rgba(212, 175, 55, 0.08);
  }
  .achievement-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: rgba(212, 175, 55, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .achievement-icon svg {
    width: 22px; height: 22px;
    stroke: var(--gold-soft);
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .achievement-info {
    flex: 1;
    min-width: 0;
  }
  .achievement-name {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .achievement-desc {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.4;
  }
  .achievement-status {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .achievement-status.done {
    background: rgba(100, 255, 150, 0.15);
    border: 1px solid rgba(100, 255, 150, 0.4);
  }
  .achievement-status.done svg {
    width: 12px; height: 12px;
    stroke: #88ffaa;
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .achievement-status.locked {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .achievement-status.locked svg {
    width: 10px; height: 10px;
    stroke: var(--muted);
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(20, 25, 20, 0.95);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(100, 255, 150, 0.3);
    border-radius: 14px;
    padding: 14px 20px;
    z-index: 2000;
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: 90%;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  .toast svg {
    width: 16px; height: 16px;
    stroke: #88ffaa;
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }
  .toast .toast-text {
    font-size: 13px;
    font-weight: 700;
    color: #d0ffd8;
  }

  /* Bottom nav */
  .bottom-nav {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 468px;
    background: rgba(20, 17, 12, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 8px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    z-index: 100;
    box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 4px;
    border-radius: 16px;
    text-decoration: none;
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
    transition: all 0.25s ease;
    position: relative;
  }
  .nav-item svg {
    width: 20px; height: 20px;
    stroke: currentColor;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .nav-item:hover {
    color: var(--text);
    background: rgba(35, 30, 22, 0.5);
  }
  .nav-item.active {
    color: var(--gold-soft);
  }
  .nav-item.active::after {
    content: '';
    position: absolute;
    bottom: 2px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold-glow);
  }
</style>
</head>
<body>

<div class="dash-bg"></div>
<div class="dash-overlay"></div>

<div class="wrap">

  <div class="profil-header">
    <h1>Profil</h1>
    <a class="back-btn" href="/">
      <svg viewBox="0 0 24 24">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
    </a>
  </div>
  <div class="profil-sub">Profil & progress lo — tersimpan di browser.</div>

  <!-- Profile Card -->
  <div class="card">
    <div class="profile-main">
      <div class="profile-avatar-lg" id="avatarBtn" onclick="openAvatarModal()">
        <span id="avatarContent">V</span>
        <div class="edit-badge">
          <svg viewBox="0 0 24 24">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
        </div>
      </div>
      <div class="profile-info-lg">
        <div class="profile-name-lg" id="nameDisplay" onclick="openNameModal()">
          <span id="nameText">V4L3N User</span>
          <span class="edit-icon">
            <svg viewBox="0 0 24 24">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </span>
        </div>
        <span class="profile-level-lg" id="levelDisplay">LV 1</span>
      </div>
    </div>

    <div class="xp-bar-wrap">
      <div class="xp-bar-label">
        <span>XP</span>
        <span><span class="val" id="xpCurrent">0</span> / <span id="xpMax">100</span></span>
      </div>
      <div class="xp-bar">
        <div class="xp-bar-fill" id="xpBar"></div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-item">
        <div class="icon-svg">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
          </svg>
        </div>
        <div class="val" id="statKoin">0</div>
        <div class="label">Koin</div>
      </div>
      <div class="stat-item">
        <div class="icon-svg">
          <svg viewBox="0 0 24 24">
            <line x1="6" y1="12" x2="10" y2="12"/>
            <line x1="8" y1="10" x2="8" y2="14"/>
            <line x1="15" y1="13" x2="15.01" y2="13"/>
            <line x1="18" y1="11" x2="18.01" y2="11"/>
            <rect x="2" y="6" width="20" height="12" rx="3"/>
          </svg>
        </div>
        <div class="val" id="statGame">0</div>
        <div class="label">Main</div>
      </div>
      <div class="stat-item">
        <div class="icon-svg">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="6"/>
            <polyline points="8.21 13.89 7 22 12 19 17 22 15.79 13.88"/>
          </svg>
        </div>
        <div class="val" id="statAch">0</div>
        <div class="label">Achievement</div>
      </div>
    </div>
  </div>

  <!-- Daily Reward -->
  <div class="card">
    <h3>
      <svg viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      Daily Reward
    </h3>
    <button class="daily-btn" id="dailyBtn" onclick="claimDaily()">
      <svg viewBox="0 0 24 24">
        <polyline points="20 12 20 22 4 22 4 12"/>
        <rect x="2" y="7" width="20" height="5"/>
        <line x1="12" y1="22" x2="12" y2="7"/>
        <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/>

<script>
  // ============ DATA ============
  const STORAGE_KEY = 'v4l3n_user_data';

  const defaultUser = {
    name: 'V4L3N User',
    avatar: null, // null = pakai inisial, atau base64 string dari gambar
    level: 1,
    xp: 0,
    koin: 0,
    gamesPlayed: 0,
    achievements: [],
    lastDaily: null,
    dailyStreak: 0
  };

  function loadUser() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) return { ...defaultUser, ...JSON.parse(saved) };
    } catch(e) {}
    return { ...defaultUser };
  }

  function saveUser(user) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(user));
    } catch(e) {
      showToast('⚠️ Gagal simpan data');
    }
  }

  let user = loadUser();

  // ============ ACHIEVEMENTS (pakai SVG) ============
  const ACHIEVEMENTS = [
    { id: 'first_visit', name: 'Selamat Datang', desc: 'Buka web V4L3N pertama kali',
      svg: '<path d="M7 11V7a5 5 0 0 1 10 0v4"/><path d="M4 11h16v10H4z"/>' },
    { id: 'daily_1', name: 'Klaim Pertama', desc: 'Klaim daily reward pertama',
      svg: '<polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/>' },
    { id: 'daily_7', name: 'Streak 7 Hari', desc: 'Klaim daily 7 hari berturut-turut',
      svg: '<path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z"/>' },
    { id: 'play_1', name: 'Gamer Pemula', desc: 'Main game pertama kali',
      svg: '<rect x="2" y="6" width="20" height="12" rx="3"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/>' },
    { id: 'play_10', name: 'Gamer Sejati', desc: 'Main game 10 kali',
      svg: '<polygon points="12 2 15 9 22 9 16 14 18 21 12 17 6 21 8 14 2 9 9 9"/>' },
    { id: 'koin_100', name: 'Kolektor', desc: 'Kumpulin 100 koin',
      svg: '<circle cx="12" cy="12" r="10"/><path d="M12 6v12M8 10h8M8 14h8"/>' },
    { id: 'koin_1000', name: 'Sultan', desc: 'Kumpulin 1000 koin',
      svg: '<polygon points="2 20 22 20 20 8 12 14 4 8 2 20"/><circle cx="12" cy="14" r="2"/>' },
    { id: 'level_5', name: 'Naik Level', desc: 'Capai level 5',
      svg: '<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>' },
    { id: 'level_10', name: 'Bintang', desc: 'Capai level 10',
      svg: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>' }
  ];

  if (!user.achievements.includes('first_visit')) {
    user.achievements.push('first_visit');
    saveUser(user);
  }

  // ============ LEVEL ============
  function xpForLevel(level) {
    return level * 100;
  }

  // ============ RENDER ============
  function renderProfile() {
    // Avatar
    const avatarContent = document.getElementById('avatarContent');
    if (user.avatar) {
      avatarContent.outerHTML = `<img id="avatarContent" src="${user.avatar}" alt="Avatar" />`;
    } else {
      const existingImg = document.getElementById('avatarContent');
      if (existingImg && existingImg.tagName === 'IMG') {
        existingImg.outerHTML = `<span id="avatarContent">${(user.name || 'V')[0].toUpperCase()}</span>`;
      } else {
        avatarContent.textContent = (user.name || 'V')[0].toUpperCase();
      }
    }

    document.getElementById('nameText').textContent = user.name;
    document.getElementById('levelDisplay').textContent = 'LV ' + user.level;

    const xpMax = xpForLevel(user.level);
    document.getElementById('xpCurrent').textContent = user.xp;
    document.getElementById('xpMax').textContent = xpMax;
    document.getElementById('xpBar').style.width = (user.xp / xpMax * 100) + '%';

    document.getElementById('statKoin').textContent = user.koin;
    document.getElementById('statGame').textContent = user.gamesPlayed;
    document.getElementById('statAch').textContent = user.achievements.length;

    renderAchievements();
    renderDaily();
  }

  function renderAchievements() {
    const list = document.getElementById('achievementList');
    list.innerHTML = '';
    ACHIEVEMENTS.forEach(ach => {
      const unlocked = user.achievements.includes(ach.id);
      const div = document.createElement('div');
      div.className = 'achievement-item ' + (unlocked ? 'unlocked' : 'locked');
      div.innerHTML = `
        <div class="achievement-icon">
          <svg viewBox="0 0 24 24">${ach.svg}</svg>
        </div>
        <div class="achievement-info">
          <div class="achievement-name">${ach.name}</div>
          <div class="achievement-desc">${ach.desc}</div>
        </div>
        <div class="achievement-status ${unlocked ? 'done' : 'locked'}">
          ${unlocked 
            ? '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
            : '<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
          }
        </div>
      `;
      list.appendChild(div);
    });
  }

  function renderDaily() {
    const btn = document.getElementById('dailyBtn');
    const info = document.getElementById('dailyInfo');
    const btnText = document.getElementById('dailyBtnText');

    if (!user.lastDaily) {
      btn.disabled = false;
      btnText.textContent = 'Klaim Koin Harian';
      info.textContent = 'Klaim tiap hari, dapet 50 koin + 10 XP';
      return;
    }

    const now = new Date();
    const last = new Date(user.lastDaily);
    const diffMs = now - last;
    const diffHours = diffMs / (1000 * 60 * 60);

    if (diffHours < 24) {
      btn.disabled = true;
      const remaining = 24 - diffHours;
      const h = Math.floor(remaining);
      const m = Math.floor((remaining - h) * 60);
      btnText.textContent = `Tunggu ${h}j ${m}m lagi`;
      info.textContent = `Streak: ${user.dailyStreak} hari`;
    } else {
      btn.disabled = false;
      btnText.textContent = 'Klaim Koin Harian';
      info.textContent = `Streak: ${user.dailyStreak} hari`;
    }
  }

  // ============ DAILY ============
  function claimDaily() {
    const now = new Date();
    const last = user.lastDaily ? new Date(user.lastDaily) : null;
    let streak = user.dailyStreak;

    if (last) {
      const diffHours = (now - last) / (1000 * 60 * 60);
      if (diffHours < 48) streak++;
      else streak = 1;
    } else {
      streak = 1;
    }

    const totalKoin = 50 + Math.min(streak * 10, 100);
    const totalXP = 10 + streak * 2;

    user.koin += totalKoin;
    user.xp += totalXP;
    user.dailyStreak = streak;
    user.lastDaily = now.toISOString();

    while (user.xp >= xpForLevel(user.level)) {
      user.xp -= xpForLevel(user.level);
      user.level++;
    }

    if (!user.achievements.includes('daily_1')) user.achievements.push('daily_1');
    if (streak >= 7 && !user.achievements.includes('daily_7')) user.achievements.push('daily_7');
    if (user.koin >= 100 && !user.achievements.includes('koin_100')) user.achievements.push('koin_100');
    if (user.koin >= 1000 && !user.achievements.includes('koin_1000')) user.achievements.push('koin_1000');
    if (user.level >= 5 && !user.achievements.includes('level_5')) user.achievements.push('level_5');
    if (user.level >= 10 && !user.achievements.includes('level_10')) user.achievements.push('level_10');

    saveUser(user);
    renderProfile();
    showToast(`+${totalKoin} koin, +${totalXP} XP! Streak: ${streak} hari`);
  }

  // ============ AVATAR MODAL ============
  function openAvatarModal() {
    // Update preview
    const preview = document.getElementById('avatarPreview');
    if (user.avatar) {
      preview.innerHTML = `<img src="${user.avatar}" alt="Avatar" />`;
    } else {
      preview.innerHTML = `
        <svg viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      `;
    }
    document.getElementById('avatarModal').classList.add('show');
  }

  function closeAvatarModal() {
    document.getElementById('avatarModal').classList.remove('show');
    document.getElementById('avatarUpload').value = '';
  }

  function handleAvatarUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    // Cek ukuran (max 2 MB)
    if (file.size > 2 * 1024 * 1024) {
      showToast('⚠️ File terlalu besar (max 2 MB)');
      return;
    }

    // Cek tipe
    if (!file.type.startsWith('image/')) {
      showToast('⚠️ File harus gambar');
      return;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
      // Compress gambar dulu biar localStorage nggak penuh
      compressImage(e.target.result, 400, 0.85, (compressed) => {
        user.avatar = compressed;
        saveUser(user);
        renderProfile();

        // Update preview
        const preview = document.getElementById('avatarPreview');
        preview.innerHTML = `<img src="${compressed}" alt="Avatar" />`;

        showToast('Avatar diganti!');
        setTimeout(closeAvatarModal, 800);
      });
    };
    reader.readAsDataURL(file);
  }

  // Compress gambar biar muat di localStorage
  function compressImage(dataUrl, maxSize, quality, callback) {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width;
      let h = img.height;

      if (w > h) {
        if (w > maxSize) { h = (h * maxSize) / w; w = maxSize; }
      } else {
        if (h > maxSize) { w = (w * maxSize) / h; h = maxSize; }
      }

      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);

      callback(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  }

  function resetAvatar() {
    user.avatar = null;
    saveUser(user);
    renderProfile();
    openAvatarModal(); // Refresh preview
    showToast('Avatar direset');
  }

  // ============ NAME MODAL ============
  function openNameModal() {
    document.getElementById('nameInput').value = user.name;
    document.getElementById('nameModal').classList.add('show');
    setTimeout(() => document.getElementById('nameInput').focus(), 100);
  }

  function saveName() {
    const newName = document.getElementById('nameInput').value.trim();
    if (!newName) {
      showToast('Nama nggak boleh kosong');
      return;
    }
    user.name = newName;
    saveUser(user);
    renderProfile();
    closeNameModal();
    showToast('Nama diganti!');
  }

  function closeNameModal() {
    document.getElementById('nameModal').classList.remove('show');
  }

  // Tutup modal kalau klik overlay
  document.getElementById('avatarModal').addEventListener('click', (e) => {
    if (e.target.id === 'avatarModal') closeAvatarModal();
  });
  document.getElementById('nameModal').addEventListener('click', (e) => {
    if (e.target.id === 'nameModal') closeNameModal();
  });

  // ============ TOAST ============
  let toastTimeout;
  function showToast(msg) {
    const toast = document.getElementById('toast');
    const text = document.getElementById('toastText');
    text.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
      toast.classList.remove('show');
    }, 3000);
  }

  // ============ INIT ============
  renderProfile();
  setInterval(renderDaily, 60000);
</script>
