<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil // v4l3n</title>
<style>
  :root {
    --bg: #0a0a0c;
    --panel: rgba(18, 15, 12, 0.75);
    --border: rgba(255, 215, 0, 0.15);
    --gold: #d4af37;
    --gold-soft: #e8c87a;
    --gold-dim: #8a7020;
    --gold-glow: rgba(212, 175, 55, 0.3);
    --text: #ece8e0;
    --muted: #8a8070;
    --font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .dash-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image: url('assets/tenka-bg.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }

  .dash-overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: linear-gradient(180deg,
      rgba(10, 8, 6, 0.65) 0%,
      rgba(10, 8, 6, 0.5) 40%,
      rgba(10, 8, 6, 0.85) 100%);
    pointer-events: none;
  }

  .wrap {
    position: relative;
    z-index: 2;
    max-width: 500px;
    margin: 0 auto;
    padding: 20px 16px 120px;
  }

  /* Header */
  .profil-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .profil-header h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .back-btn {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: rgba(25, 20, 15, 0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: all 0.25s ease;
  }
  .back-btn:hover {
    background: rgba(45, 38, 25, 0.8);
    border-color: var(--gold-dim);
  }
  .back-btn svg {
    width: 20px; height: 20px;
    stroke: var(--text);
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .profil-sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  /* Card umum */
  .card {
    background: var(--panel);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 14px;
  }
  .card h3 {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--gold-soft);
  }
  .card h3 svg {
    width: 16px; height: 16px;
    stroke: var(--gold-soft);
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Profile card */
  .profile-main {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }
  .profile-avatar-lg {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, #d4af37, #e8c87a);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    flex-shrink: 0;
    box-shadow: 0 0 30px var(--gold-glow);
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
  }
  .profile-avatar-lg:hover {
    transform: scale(1.05);
    box-shadow: 0 0 40px var(--gold-glow);
  }
  .profile-avatar-lg::after {
    content: '✎';
    position: absolute;
    bottom: 0;
    right: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--gold);
    color: #1a1408;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--bg);
    font-weight: 700;
  }
  .profile-info-lg {
    flex: 1;
    min-width: 0;
  }
  .profile-name-lg {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .profile-name-lg .edit-icon {
    font-size: 12px;
    color: var(--muted);
  }
  .profile-level-lg {
    display: inline-block;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    background: rgba(212, 175, 55, 0.15);
    color: var(--gold-soft);
    border: 1px solid rgba(212, 175, 55, 0.3);
    border-radius: 6px;
  }

  /* XP Bar */
  .xp-bar-wrap {
    margin-bottom: 20px;
  }
  .xp-bar-label {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .xp-bar-label .val {
    color: var(--gold-soft);
    font-weight: 700;
  }
  .xp-bar {
    width: 100%;
    height: 8px;
    background: rgba(255, 215, 0, 0.1);
    border-radius: 4px;
    overflow: hidden;
  }
  .xp-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--gold), var(--gold-soft));
    box-shadow: 0 0 15px var(--gold-glow);
    transition: width 0.6s ease;
    border-radius: 4px;
  }

  /* Stats grid */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .stat-item {
    background: rgba(10, 8, 6, 0.6);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 8px;
    text-align: center;
  }
  .stat-item .icon {
    font-size: 22px;
    margin-bottom: 6px;
  }
  .stat-item .val {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 800;
    color: var(--gold-soft);
    margin-bottom: 2px;
  }
  .stat-item .label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Daily reward */
  .daily-btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #d4af37, #e8c87a);
    color: #1a1408;
    border: none;
    border-radius: 14px;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
    margin-bottom: 10px;
  }
  .daily-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(212, 175, 55, 0.5);
  }
  .daily-btn:disabled {
    background: rgba(40, 35, 28, 0.6);
    color: var(--muted);
    box-shadow: none;
    cursor: not-allowed;
  }
  .daily-info {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    font-family: var(--mono);
  }

  /* Avatar picker modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.show {
    display: flex;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .modal {
    background: var(--panel);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal h3 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
    text-align: center;
    color: var(--gold-soft);
  }
  .avatar-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .avatar-option {
    aspect-ratio: 1;
    background: rgba(10, 8, 6, 0.6);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .avatar-option:hover {
    background: rgba(212, 175, 55, 0.15);
    border-color: var(--gold);
    transform: scale(1.05);
  }
  .avatar-option.selected {
    background: rgba(212, 175, 55, 0.2);
    border-color: var(--gold);
    box-shadow: 0 0 15px var(--gold-glow);
  }

  .modal input {
    width: 100%;
    padding: 12px 14px;
    background: rgba(10, 8, 6, 0.7);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    outline: none;
    margin-bottom: 14px;
  }
  .modal input:focus {
    border-color: var(--gold-dim);
  }

  .modal-actions {
    display: flex;
    gap: 10px;
  }
  .modal-btn {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
    border: none;
  }
  .modal-btn.primary {
    background: linear-gradient(135deg, #d4af37, #e8c87a);
    color: #1a1408;
  }
  .modal-btn.secondary {
    background: rgba(25, 20, 15, 0.8);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .modal-btn:hover {
    transform: translateY(-2px);
  }

  /* Achievement */
  .achievement-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .achievement-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: rgba(10, 8, 6, 0.6);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: all 0.25s ease;
  }
  .achievement-item.locked {
    opacity: 0.4;
  }
  .achievement-item.unlocked {
    border-color: rgba(212, 175, 55, 0.4);
    background: rgba(212, 175, 55, 0.08);
  }
  .achievement-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: rgba(212, 175, 55, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .achievement-info {
    flex: 1;
    min-width: 0;
  }
  .achievement-name {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .achievement-desc {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.4;
  }
  .achievement-status {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .achievement-status.done {
    background: rgba(100, 255, 150, 0.15);
    color: #88ffaa;
    border: 1px solid rgba(100, 255, 150, 0.3);
  }
  .achievement-status.locked {
    background: rgba(255, 255, 255, 0.05);
    color: var(--muted);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(20, 25, 20, 0.95);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(100, 255, 150, 0.3);
    border-radius: 14px;
    padding: 14px 20px;
    z-index: 2000;
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  .toast .toast-text {
    font-size: 13px;
    font-weight: 700;
    color: #d0ffd8;
  }

  /* Bottom nav */
  .bottom-nav {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 468px;
    background: rgba(20, 17, 12, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 8px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    z-index: 100;
    box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 4px;
    border-radius: 16px;
    text-decoration: none;
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
    transition: all 0.25s ease;
    position: relative;
  }
  .nav-item svg {
    width: 20px; height: 20px;
    stroke: currentColor;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .nav-item:hover {
    color: var(--text);
    background: rgba(35, 30, 22, 0.5);
  }
  .nav-item.active {
    color: var(--gold-soft);
  }
  .nav-item.active::after {
    content: '';
    position: absolute;
    bottom: 2px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold-glow);
  }
</style>
</head>
<body>

<div class="dash-bg"></div>
<div class="dash-overlay"></div>

<div class="wrap">

  <div class="profil-header">
    <h1>Profil</h1>
    <a class="back-btn" href="/">
      <svg viewBox="0 0 24 24">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
    </a>
  </div>
  <div class="profil-sub">Profil & progress lo — tersimpan di browser.</div>

  <!-- Profile Card -->
  <div class="card">
    <div class="profile-main">
      <div class="profile-avatar-lg" id="avatarBtn" onclick="openAvatarModal()">🦊</div>
      <div class="profile-info-lg">
        <div class="profile-name-lg" id="nameDisplay" onclick="openNameModal()">
          V4L3N User <span class="edit-icon">✎</span>
        </div>
        <span class="profile-level-lg" id="levelDisplay">LV 1</span>
      </div>
    </div>

    <div class="xp-bar-wrap">
      <div class="xp-bar-label">
        <span>XP</span>
        <span><span class="val" id="xpCurrent">0</span> / <span id="xpMax">100</span></span>
      </div>
      <div class="xp-bar">
        <div class="xp-bar-fill" id="xpBar"></div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-item">
        <div class="icon">💰</div>
        <div class="val" id="statKoin">0</div>
        <div class="label">Koin</div>
      </div>
      <div class="stat-item">
        <div class="icon">🎮</div>
        <div class="val" id="statGame">0</div>
        <div class="label">Main</div>
      </div>
      <div class="stat-item">
        <div class="icon">🏆</div>
        <div class="val" id="statAch">0</div>
        <div class="label">Achievement</div>
      </div>
    </div>
  </div>

  <!-- Daily Reward -->
  <div class="card">
    <h3>
      <svg viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      Daily Reward
    </h3>
    <button class="daily-btn" id="dailyBtn" onclick="claimDaily()">
      🎁 Klaim Koin Harian
    </button>
    <div class="daily-info" id="dailyInfo">Klaim tiap hari, dapet 50 koin + 10 XP</div>
  </div>

  <!-- Achievement -->
  <div class="card">
    <h3>
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="6"/>
        <polyline points="8.21 13.89 7 22 12 19 17 22 15.79 13.88"/>
      </svg>
      Achievement
    </h3>
    <div class="achievement-list" id="achievementList"></div>
  </div>

</div>

<!-- Modal Avatar -->
<div class="modal-overlay" id="avatarModal">
  <div class="modal">
    <h3>Pilih Avatar</h3>
    <div class="avatar-grid" id="avatarGrid"></div>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeAvatarModal()">Tutup</button>
    </div>
  </div>
</div>

<!-- Modal Nama -->
<div class="modal-overlay" id="nameModal">
  <div class="modal">
    <h3>Ganti Nama</h3>
    <input type="text" id="nameInput" placeholder="Nama lo..." maxlength="20" />
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeNameModal()">Batal</button>
      <button class="modal-btn primary" onclick="saveName()">Simpan</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <div class="toast-text" id="toastText">✓ Berhasil!</div>
</div>

<!-- Bottom nav -->
<nav class="bottom-nav">
  <a class="nav-item" href="/game.html">
    <svg viewBox="0 0 24 24">
      <line x1="6" y1="12" x2="10" y2="12"/>
      <line x1="8" y1="10" x2="8" y2="14"/>
      <line x1="15" y1="13" x2="15.01" y2="13"/>
      <line x1="18" y1="11" x2="18.01" y2="11"/>
      <rect x="2" y="6" width="20" height="12" rx="3"/>
    </svg>
    <span>Game</span>
  </a>
  <a class="nav-item" href="https://valenmanga.my.id" target="_blank">
    <svg viewBox="0 0 24 24">
      <path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/>
      <path d="M20 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/>
    </svg>
    <span>Komik</span>
  </a>
  <a class="nav-item active" href="/profil.html">
    <svg viewBox="0 0 24 24">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
    <span>Profil</span>
  </a>
  <a class="nav-item" href="/dev.html">
    <svg viewBox="0 0 24 24">
      <polyline points="16 18 22 12 16 6"/>
      <polyline points="8 6 2 12 8 18"/>
    </svg>
    <span>Dev</span>
  </a>
  <a class="nav-item" href="/tools.html">
    <svg viewBox="0 0 24 24">
      <path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-2.4 2.6-2.6z"/>
    </svg>
    <span>Tools</span>
  </a>
</nav>

<script>
  // ============ DATA MANAGEMENT ============
  const STORAGE_KEY = 'v4l3n_user_data';

  const defaultUser = {
    name: 'V4L3N User',
    avatar: '🦊',
    level: 1,
    xp: 0,
    koin: 0,
    gamesPlayed: 0,
    achievements: [],
    lastDaily: null,
    dailyStreak: 0
  };

  function loadUser() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) return { ...defaultUser, ...JSON.parse(saved) };
    } catch(e) {}
    return { ...defaultUser };
  }

  function saveUser(user) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(user));
    } catch(e) {}
  }

  let user = loadUser();

  // ============ ACHIEVEMENTS ============
  const ACHIEVEMENTS = [
    { id: 'first_visit', icon: '👋', name: 'Selamat Datang', desc: 'Buka web V4L3N pertama kali' },
    { id: 'daily_1', icon: '🎁', name: 'Klaim Pertama', desc: 'Klaim daily reward pertama' },
    { id: 'daily_7', icon: '🔥', name: 'Streak 7 Hari', desc: 'Klaim daily 7 hari berturut-turut' },
    { id: 'play_1', icon: '🎮', name: 'Gamer Pemula', desc: 'Main game pertama kali' },
    { id: 'play_10', icon: '🕹️', name: 'Gamer Sejati', desc: 'Main game 10 kali' },
    { id: 'koin_100', icon: '💰', name: 'Kolektor', desc: 'Kumpulin 100 koin' },
    { id: 'koin_1000', icon: '💎', name: 'Sultan', desc: 'Kumpulin 1000 koin' },
    { id: 'level_5', icon: '⭐', name: 'Naik Level', desc: 'Capai level 5' },
    { id: 'level_10', icon: '🌟', name: 'Bintang', desc: 'Capai level 10' }
  ];

  // Unlock achievement pertama kali
  if (!user.achievements.includes('first_visit')) {
    user.achievements.push('first_visit');
    saveUser(user);
  }

  // ============ FUNGSI LEVEL ============
  function xpForLevel(level) {
    // Level 1→2: 100 XP, 2→3: 200 XP, dst
    return level * 100;
  }

  function addXP(amount) {
    user.xp += amount;
    let leveledUp = false;
    while (user.xp >= xpForLevel(user.level)) {
      user.xp -= xpForLevel(user.level);
      user.level++;
      leveledUp = true;
    }
    if (leveledUp) {
      showToast('🎉 Naik ke Level ' + user.level + '!');
    }
    saveUser(user);
    renderProfile();
  }

  function addKoin(amount) {
    user.koin += amount;
    saveUser(user);
    renderProfile();
  }

  // ============ RENDER PROFIL ============
  function renderProfile() {
    document.getElementById('avatarBtn').textContent = user.avatar;
    document.getElementById('nameDisplay').innerHTML = escapeHtml(user.name) + ' <span class="edit-icon">✎</span>';
    document.getElementById('levelDisplay').textContent = 'LV ' + user.level;

    const xpMax = xpForLevel(user.level);
    document.getElementById('xpCurrent').textContent = user.xp;
    document.getElementById('xpMax').textContent = xpMax;
    document.getElementById('xpBar').style.width = (user.xp / xpMax * 100) + '%';

    document.getElementById('statKoin').textContent = user.koin;
    document.getElementById('statGame').textContent = user.gamesPlayed;
    document.getElementById('statAch').textContent = user.achievements.length;

    renderAchievements();
    renderDaily();
  }

  function renderAchievements() {
    const list = document.getElementById('achievementList');
    list.innerHTML = '';
    ACHIEVEMENTS.forEach(ach => {
      const unlocked = user.achievements.includes(ach.id);
      const div = document.createElement('div');
      div.className = 'achievement-item ' + (unlocked ? 'unlocked' : 'locked');
      div.innerHTML = `
        <div class="achievement-icon">${ach.icon}</div>
        <div class="achievement-info">
          <div class="achievement-name">${ach.name}</div>
          <div class="achievement-desc">${ach.desc}</div>
        </div>
        <div class="achievement-status ${unlocked ? 'done' : 'locked'}">${unlocked ? '✓' : '🔒'}</div>
      `;
      list.appendChild(div);
    });
  }

  function renderDaily() {
    const btn = document.getElementById('dailyBtn');
    const info = document.getElementById('dailyInfo');

    if (!user.lastDaily) {
      btn.disabled = false;
      btn.textContent = '🎁 Klaim Koin Harian';
      info.textContent = 'Klaim tiap hari, dapet 50 koin + 10 XP';
      return;
    }

    const now = new Date();
    const last = new Date(user.lastDaily);
    const diffMs = now - last;
    const diffHours = diffMs / (1000 * 60 * 60);

    if (diffHours < 24) {
      btn.disabled = true;
      const remaining = 24 - diffHours;
      const h = Math.floor(remaining);
      const m = Math.floor((remaining - h) * 60);
      btn.textContent = `⏳ Tunggu ${h}j ${m}m lagi`;
      info.textContent = `Streak: ${user.dailyStreak} hari 🔥`;
    } else {
      btn.disabled = false;
      btn.textContent = '🎁 Klaim Koin Harian';
      info.textContent = `Streak: ${user.dailyStreak} hari 🔥`;
    }
  }

  // ============ DAILY REWARD ============
  function claimDaily() {
    const now = new Date();
    const last = user.lastDaily ? new Date(user.lastDaily) : null;
    let streak = user.dailyStreak;

    if (last) {
      const diffHours = (now - last) / (1000 * 60 * 60);
      if (diffHours < 48) {
        streak++;
      } else {
        streak = 1;
      }
    } else {
      streak = 1;
    }

    const baseReward = 50;
    const bonus = Math.min(streak * 10, 100); // Maks bonus 100
    const totalKoin = baseReward + bonus;
    const totalXP = 10 + streak * 2;

    user.koin += totalKoin;
    user.xp += totalXP;
    user.dailyStreak = streak;
    user.lastDaily = now.toISOString();

    // Cek level up
    while (user.xp >= xpForLevel(user.level)) {
      user.xp -= xpForLevel(user.level);
      user.level++;
    }

    // Cek achievement
    if (!user.achievements.includes('daily_1')) user.achievements.push('daily_1');
    if (streak >= 7 && !user.achievements.includes('daily_7')) user.achievements.push('daily_7');
    if (user.koin >= 100 && !user.achievements.includes('koin_100')) user.achievements.push('koin_100');
    if (user.koin >= 1000 && !user.achievements.includes('koin_1000')) user.achievements.push('koin_1000');
    if (user.level >= 5 && !user.achievements.includes('level_5')) user.achievements.push('level_5');
    if (user.level >= 10 && !user.achievements.includes('level_10')) user.achievements.push('level_10');

    saveUser(user);
    renderProfile();
    showToast(`🎁 +${totalKoin} koin, +${totalXP} XP! Streak: ${streak} hari`);
  }

  // ============ AVATAR MODAL ============
  const AVATARS = ['🦊', '🐱', '🐶', '🐼', '🐯', '🦁', '🐸', '🐵', '🦄', '🐲', '👾', '🤖', '👻', '🎃', '😎', '🤠', '🥷', '🧙', '👑', '💀'];

  function openAvatarModal() {
    const grid = document.getElementById('avatarGrid');
    grid.innerHTML = '';
    AVATARS.forEach(av => {
      const div = document.createElement('div');
      div.className = 'avatar-option' + (av === user.avatar ? ' selected' : '');
      div.textContent = av;
      div.onclick = () => selectAvatar(av);
      grid.appendChild(div);
    });
    document.getElementById('avatarModal').classList.add('show');
  }

  function selectAvatar(av) {
    user.avatar = av;
    saveUser(user);
    renderProfile();
    closeAvatarModal();
    showToast('✓ Avatar diganti!');
  }

  function closeAvatarModal() {
    document.getElementById('avatarModal').classList.remove('show');
  }

  // ============ NAME MODAL ============
  function openNameModal() {
    document.getElementById('nameInput').value = user.name;
    document.getElementById('nameModal').classList.add('show');
    setTimeout(() => document.getElementById('nameInput').focus(), 100);
  }

  function saveName() {
    const newName = document.getElementById('nameInput').value.trim();
    if (!newName) {
      showToast('⚠️ Nama nggak boleh kosong');
      return;
    }
    user.name = newName;
    saveUser(user);
    renderProfile();
    closeNameModal();
    showToast('✓ Nama diganti!');
  }

  function closeNameModal() {
    document.getElementById('nameModal').classList.remove('show');
  }

  // Tutup modal kalau klik overlay
  document.getElementById('avatarModal').addEventListener('click', (e) => {
    if (e.target.id === 'avatarModal') closeAvatarModal();
  });
  document.getElementById('nameModal').addEventListener('click', (e) => {
    if (e.target.id === 'nameModal') closeNameModal();
  });

  // ============ TOAST ============
  let toastTimeout;
  function showToast(msg) {
    const toast = document.getElementById('toast');
    const text = document.getElementById('toastText');
    text.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
      toast.classList.remove('show');
    }, 3000);
  }

  // ============ UTILS ============
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ============ AUTO REFRESH DAILY ============
  setInterval(renderDaily, 60000); // Update tiap menit

  // Init
  renderProfile();
</script>

</body>
</html>
