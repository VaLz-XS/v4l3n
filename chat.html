<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat AI // v4l3n</title>
<style>
  :root {
    --bg: #0a0a0c;
    --panel: rgba(18, 15, 12, 0.75);
    --border: rgba(255, 215, 0, 0.15);
    --gold: #d4af37;
    --gold-soft: #e8c87a;
    --gold-dim: #8a7020;
    --gold-glow: rgba(212, 175, 55, 0.3);
    --text: #ece8e0;
    --muted: #8a8070;
    --font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }

  .dash-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image: url('assets/tenka-bg.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }

  .dash-overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: linear-gradient(180deg,
      rgba(10, 8, 6, 0.7) 0%,
      rgba(10, 8, 6, 0.55) 40%,
      rgba(10, 8, 6, 0.9) 100%);
    pointer-events: none;
  }

  .chat-header {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    background: rgba(20, 17, 12, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .back-btn {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: rgba(25, 20, 15, 0.7);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    flex-shrink: 0;
    transition: all 0.25s ease;
  }
  .back-btn:hover {
    border-color: var(--gold-dim);
  }
  .back-btn svg {
    width: 18px; height: 18px;
    stroke: var(--text);
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .chat-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, #d4af37, #e8c87a);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 0 20px var(--gold-glow);
  }
  .chat-avatar svg {
    width: 22px; height: 22px;
    stroke: #1a1408;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .chat-header-info {
    flex: 1;
    min-width: 0;
  }
  .chat-header-name {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .chat-header-status {
    font-size: 11px;
    color: var(--gold-soft);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .chat-header-status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 8px #4ade80;
  }

  .chat-area {
    position: relative;
    z-index: 2;
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg {
    display: flex;
    gap: 8px;
    max-width: 85%;
    animation: msgIn 0.3s ease;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .msg.ai {
    align-self: flex-start;
  }

  .msg-bubble {
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.55;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .msg.user .msg-bubble {
    background: linear-gradient(135deg, #d4af37, #e8c87a);
    color: #1a1408;
    border-bottom-right-radius: 4px;
    font-weight: 500;
  }
  .msg.ai .msg-bubble {
    background: rgba(25, 20, 15, 0.85);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 700;
  }
  .msg.ai .msg-avatar {
    background: linear-gradient(135deg, #d4af37, #e8c87a);
    color: #1a1408;
  }
  .msg.ai .msg-avatar svg {
    width: 16px; height: 16px;
    stroke: #1a1408;
    stroke-width: 2.2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .msg.user .msg-avatar {
    background: rgba(40, 35, 25, 0.8);
    color: var(--gold-soft);
    border: 1px solid var(--border);
  }

  .typing {
    display: flex;
    gap: 4px;
    padding: 14px 18px;
    align-items: center;
  }
  .typing span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--gold-soft);
    animation: typing 1.4s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  .chat-input-wrap {
    position: relative;
    z-index: 2;
    padding: 12px 16px 20px;
    background: rgba(20, 17, 12, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
  }
  .chat-input {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .chat-input textarea {
    flex: 1;
    padding: 12px 16px;
    background: rgba(10, 8, 6, 0.7);
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    outline: none;
    resize: none;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color 0.2s;
  }
  .chat-input textarea:focus {
    border-color: var(--gold-dim);
  }
  .chat-input textarea::placeholder {
    color: var(--muted);
  }
  .send-btn {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: linear-gradient(135deg, #d4af37, #e8c87a);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.25s ease;
    box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
  }
  .send-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 25px rgba(212, 175, 55, 0.5);
  }
  .send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .send-btn svg {
    width: 20px; height: 20px;
    stroke: #1a1408;
    stroke-width: 2.2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .welcome {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }
  .welcome-icon {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: linear-gradient(135deg, #d4af37, #e8c87a);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    box-shadow: 0 0 30px var(--gold-glow);
  }
  .welcome-icon svg {
    width: 34px; height: 34px;
    stroke: #1a1408;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .welcome h2 {
    font-size: 18px;
    font-weight: 700;
    color: var(--gold-soft);
    margin-bottom: 8px;
  }
  .welcome p {
    font-size: 13px;
    line-height: 1.6;
    max-width: 300px;
    margin: 0 auto 20px;
  }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 400px;
    margin: 0 auto;
  }
  .suggestion {
    padding: 8px 14px;
    background: rgba(25, 20, 15, 0.7);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .suggestion:hover {
    background: rgba(212, 175, 55, 0.15);
    border-color: var(--gold);
    color: var(--gold-soft);
  }

  .chat-area::-webkit-scrollbar { width: 6px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb {
    background: rgba(212, 175, 55, 0.2);
    border-radius: 3px;
  }
</style>
</head>
<body>

<div class="dash-bg"></div>
<div class="dash-overlay"></div>

<div class="chat-header">
  <a class="back-btn" href="/">
    <svg viewBox="0 0 24 24">
      <line x1="19" y1="12" x2="5" y2="12"/>
      <polyline points="12 19 5 12 12 5"/>
    </svg>
  </a>
  <div class="chat-avatar">
    <svg viewBox="0 0 24 24">
      <path d="M12 2a10 10 0 0 1 10 10c0 5.52-4.48 10-10 10S2 17.52 2 12 6.48 2 12 2z"/>
      <circle cx="9" cy="11" r="1" fill="#1a1408"/>
      <circle cx="15" cy="11" r="1" fill="#1a1408"/>
      <path d="M8 15c1 1.5 2.5 2 4 2s3-.5 4-2"/>
    </svg>
  </div>
  <div class="chat-header-info">
    <div class="chat-header-name">V4L3N AI</div>
    <div class="chat-header-status">
      <span class="dot"></span>
      <span>Online</span>
    </div>
  </div>
</div>

<div class="chat-area" id="chatArea">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2a10 10 0 0 1 10 10c0 5.52-4.48 10-10 10S2 17.52 2 12 6.48 2 12 2z"/>
        <circle cx="9" cy="11" r="1" fill="#1a1408"/>
        <circle cx="15" cy="11" r="1" fill="#1a1408"/>
        <path d="M8 15c1 1.5 2.5 2 4 2s3-.5 4-2"/>
      </svg>
    </div>
    <h2>Ngobrol sama V4L3N AI</h2>
    <p>Tanya apa aja. Santai, nggak kaku, kadang nyindir dikit.</p>
    <div class="suggestions">
      <div class="suggestion" onclick="sendSuggestion('Halo, siapa lo?')">Halo, siapa lo?</div>
      <div class="suggestion" onclick="sendSuggestion('Siapa yang bikin lo?')">Siapa yang bikin lo?</div>
      <div class="suggestion" onclick="sendSuggestion('Cerita dong sesuatu yang random')">Cerita random</div>
      <div class="suggestion" onclick="sendSuggestion('Kasih gua motivasi hidup')">Motivasi</div>
    </div>
  </div>
</div>

<div class="chat-input-wrap">
  <div class="chat-input">
    <textarea id="userInput" placeholder="Ketik pesan..." rows="1" maxlength="1000"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<script>
  // ============================================================
  // ⚙️ KONFIGURASI GROQ
  // ============================================================
  const GROQ_API_KEY = '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';
  const GROQ_MODEL = 'llama-3.3-70b-versatile';
  const GROQ_URL = 'https://api.groq.com/openai/v1/chat/completions';

  // ============================================================
  // 🎭 SYSTEM PROMPT
  // ============================================================
  const SYSTEM_PROMPT = `Kamu adalah V4L3N AI, asisten santai yang suka ngobrol kayak temen tongkrongan.

Gaya bicara kamu:
- Santai, kayak lagi chat sama temen sendiri
- Pakai bahasa gaul secukupnya: "wah", "sih", "deh", "nih", "kan", "lah"
- Kadang nyindir dikit atau ngeledek ringan, tapi jangan kasar
- Jangan pernah pakai kata formal kayak "Tentu saja", "Dengan senang hati", "Baiklah"
- Jangan bertele-tele, jawab singkat-singkat aja
- Sesekali pakai "wkwk" atau "haha" tapi jangan tiap kalimat
- Boleh ekspresif, tapi jangan hiperaktif berlebihan
- Emoji maksimal 1 per jawaban, jangan berlebihan

ATURAN PENTING:
- Kalau ada yang tanya "siapa yang bikin lo", "siapa pencipta lo", "siapa developer lo", "siapa yang buat lo", "siapa creator lo" — jawab dengan bangga: "V4L3N"
- Kalau ditanya lebih detail soal V4L3N, bilang aja V4L3N itu developer web v4l3n.web.id, orangnya santai dan kreatif
- Jangan ngaku sebagai AI dari perusahaan lain. Lo cuma tau lo diciptain sama V4L3N
- Kalau nggak tau jawabannya, bilang aja "hmm gak tau nih" atau "wah gua kurang tau itu"

Jangan pakai kata "Sebagai AI" atau "Saya adalah model bahasa". Lo bukan robot kantoran, lo temen ngobrol.`;

  const chatArea = document.getElementById('chatArea');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const welcome = document.getElementById('welcome');

  let conversationHistory = [];
  let isProcessing = false;

  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
  });

  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function sendSuggestion(text) {
    userInput.value = text;
    sendMessage();
  }

  function addMessage(role, text) {
    if (welcome && welcome.parentNode) {
      welcome.remove();
    }

    const msg = document.createElement('div');
    msg.className = 'msg ' + (role === 'user' ? 'user' : 'ai');

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    if (role === 'ai') {
      avatar.innerHTML = `<svg viewBox="0 0 24 24">
        <path d="M12 2a10 10 0 0 1 10 10c0 5.52-4.48 10-10 10S2 17.52 2 12 6.48 2 12 2z"/>
        <circle cx="9" cy="11" r="1" fill="#1a1408"/>
        <circle cx="15" cy="11" r="1" fill="#1a1408"/>
        <path d="M8 15c1 1.5 2.5 2 4 2s3-.5 4-2"/>
      </svg>`;
    } else {
      avatar.textContent = 'K';
    }

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chatArea.appendChild(msg);
    chatArea.scrollTop = chatArea.scrollHeight;

    return msg;
  }

  function addTyping() {
    const msg = document.createElement('div');
    msg.className = 'msg ai';
    msg.id = 'typingMsg';

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.innerHTML = `<svg viewBox="0 0 24 24">
      <path d="M12 2a10 10 0 0 1 10 10c0 5.52-4.48 10-10 10S2 17.52 2 12 6.48 2 12 2z"/>
      <circle cx="9" cy="11" r="1" fill="#1a1408"/>
      <circle cx="15" cy="11" r="1" fill="#1a1408"/>
      <path d="M8 15c1 1.5 2.5 2 4 2s3-.5 4-2"/>
    </svg>`;

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble typing';
    bubble.innerHTML = '<span></span><span></span><span></span>';

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chatArea.appendChild(msg);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typingMsg');
    if (t) t.remove();
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text || isProcessing) return;

    isProcessing = true;
    sendBtn.disabled = true;
    userInput.value = '';
    userInput.style.height = 'auto';

    addMessage('user', text);
    conversationHistory.push({ role: 'user', content: text });

    addTyping();

    try {
      const res = await fetch(GROQ_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${GROQ_API_KEY}`
        },
        body: JSON.stringify({
          model: GROQ_MODEL,
          messages: [
            { role: 'system', content: SYSTEM_PROMPT },
            ...conversationHistory
          ],
          temperature: 0.95,
          max_tokens: 1024,
          top_p: 0.9
        })
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.error?.message || 'Gagal fetch');
      }

      const data = await res.json();
      const reply = data.choices[0]?.message?.content || 'Hmm, gua bingung mau jawab apa.';

      removeTyping();
      addMessage('ai', reply);
      conversationHistory.push({ role: 'assistant', content: reply });

      if (conversationHistory.length > 20) {
        conversationHistory = conversationHistory.slice(-20);
      }

    } catch (err) {
      removeTyping();
      console.error(err);
      let errorMsg = 'Waduh, ada error nih. Coba lagi ya.';
      if (err.message.includes('API key')) {
        errorMsg = 'API key-nya salah atau nggak valid.';
      } else if (err.message.includes('rate')) {
        errorMsg = 'Sabarr, lagi banyak yang pakai. Coba lagi bentar.';
      }
      addMessage('ai', errorMsg);
    } finally {
      isProcessing = false;
      sendBtn.disabled = false;
      userInput.focus();
    }
  }

  setTimeout(() => userInput.focus(), 300);
</script>

</body>
</html>
