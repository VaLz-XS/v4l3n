<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game // v4l3n</title>
<style>
  :root {
    --bg: #0a0a0c;
    --panel: rgba(18, 15, 12, 0.75);
    --border: rgba(255, 215, 0, 0.15);
    --gold: #d4af37;
    --gold-soft: #e8c87a;
    --gold-dim: #8a7020;
    --gold-glow: rgba(212, 175, 55, 0.3);
    --text: #ece8e0;
    --muted: #8a8070;
    --font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .dash-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image: url('assets/tenka-bg.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }

  .dash-overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: linear-gradient(180deg,
      rgba(10, 8, 6, 0.7) 0%,
      rgba(10, 8, 6, 0.55) 40%,
      rgba(10, 8, 6, 0.88) 100%);
    pointer-events: none;
  }

  .wrap {
    position: relative;
    z-index: 2;
    max-width: 500px;
    margin: 0 auto;
    padding: 20px 16px 120px;
  }

  .game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .game-header h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .back-btn {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: rgba(25, 20, 15, 0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: all 0.25s ease;
  }
  .back-btn:hover {
    background: rgba(45, 38, 25, 0.8);
    border-color: var(--gold-dim);
  }
  .back-btn svg {
    width: 20px; height: 20px;
    stroke: var(--text);
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .game-sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  /* Game tabs */
  .game-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 20px;
    scrollbar-width: none;
  }
  .game-tabs::-webkit-scrollbar { display: none; }
  .game-tab {
    flex-shrink: 0;
    padding: 10px 16px;
    background: rgba(25, 20, 15, 0.7);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    white-space: nowrap;
  }
  .game-tab:hover {
    color: var(--text);
    border-color: var(--gold-dim);
  }
  .game-tab.active {
    background: rgba(212, 175, 55, 0.15);
    color: var(--gold-soft);
    border-color: rgba(212, 175, 55, 0.4);
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
  }

  /* Game panel */
  .game-panel {
    display: none;
    animation: fadeIn 0.3s ease;
  }
  .game-panel.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--panel);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 14px;
  }
  .card h3 {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 14px;
    text-align: center;
    color: var(--gold-soft);
  }

  /* ============ TIC TAC TOE ============ */
  .ttt-status {
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 16px;
    color: var(--gold-soft);
    min-height: 20px;
  }
  .ttt-board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 0 auto 16px;
    max-width: 300px;
  }
  .ttt-cell {
    aspect-ratio: 1;
    background: rgba(10, 8, 6, 0.6);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 40px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s ease;
    user-select: none;
  }
  .ttt-cell:hover:not(.taken) {
    background: rgba(35, 30, 22, 0.7);
    border-color: var(--gold-dim);
    transform: scale(1.03);
  }
  .ttt-cell.taken { cursor: not-allowed; }
  .ttt-cell.x {
    color: var(--gold-soft);
    text-shadow: 0 0 20px var(--gold-glow);
  }
  .ttt-cell.o {
    color: #88c8ff;
    text-shadow: 0 0 20px rgba(136, 200, 255, 0.4);
  }
  .ttt-cell.win {
    background: rgba(212, 175, 55, 0.2);
    border-color: var(--gold);
    animation: winPulse 0.6s ease infinite alternate;
  }
  @keyframes winPulse {
    from { box-shadow: 0 0 10px rgba(212, 175, 55, 0.4); }
    to { box-shadow: 0 0 25px rgba(212, 175, 55, 0.7); }
  }

  .game-buttons {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 18px;
    background: linear-gradient(135deg, #d4af37, #e8c87a);
    color: #1a1408;
    border: none;
    border-radius: 10px;
    font-family: var(--font);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 25px rgba(212, 175, 55, 0.4);
  }
  .btn-secondary {
    background: rgba(25, 20, 15, 0.8);
    color: var(--text);
    border: 1px solid var(--border);
    box-shadow: none;
  }
  .btn-secondary:hover {
    background: rgba(40, 32, 22, 0.9);
    border-color: var(--gold-dim);
  }
  .btn-secondary.active {
    background: rgba(212, 175, 55, 0.15);
    color: var(--gold-soft);
    border-color: rgba(212, 175, 55, 0.4);
  }

  /* ============ SNAKE ============ */
  .snake-canvas {
    display: block;
    margin: 0 auto;
    background: rgba(10, 8, 6, 0.85);
    border: 1px solid var(--border);
    border-radius: 12px;
    max-width: 100%;
    touch-action: none;
  }
  .snake-stats {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
    font-family: var(--mono);
    font-size: 12px;
  }
  .snake-stats .score {
    color: var(--gold-soft);
    font-weight: 700;
  }
  .snake-stats .best {
    color: var(--muted);
  }

  /* ============ MEMORY ============ */
  .memory-board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin: 0 auto 16px;
    max-width: 320px;
  }
  .memory-card {
    aspect-ratio: 1;
    background: rgba(10, 8, 6, 0.6);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    cursor: pointer;
    transition: all 0.25s ease;
    user-select: none;
    position: relative;
  }
  .memory-card:hover:not(.flipped):not(.matched) {
    background: rgba(35, 30, 22, 0.7);
    border-color: var(--gold-dim);
  }
  .memory-card.flipped,
  .memory-card.matched {
    background: rgba(212, 175, 55, 0.12);
    border-color: var(--gold);
  }
  .memory-card.matched {
    opacity: 0.5;
    cursor: default;
  }
  .memory-card .front {
    display: none;
  }
  .memory-card .back {
    color: var(--gold-dim);
    font-size: 20px;
  }
  .memory-card.flipped .front,
  .memory-card.matched .front {
    display: block;
  }
  .memory-card.flipped .back,
  .memory-card.matched .back {
    display: none;
  }

  /* ============ RPS ============ */
  .rps-display {
    display: flex;
    justify-content: space-around;
    align-items: center;
    margin: 20px 0;
    font-size: 60px;
  }
  .rps-choice {
    width: 100px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10, 8, 6, 0.6);
    border: 1px solid var(--border);
    border-radius: 16px;
    font-size: 50px;
  }
  .rps-vs {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--muted);
    font-weight: 700;
  }
  .rps-result {
    text-align: center;
    font-size: 18px;
    font-weight: 800;
    color: var(--gold-soft);
    min-height: 28px;
    margin-bottom: 16px;
  }
  .rps-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .rps-btn {
    padding: 20px 10px;
    background: rgba(25, 20, 15, 0.8);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    font-size: 36px;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .rps-btn:hover {
    background: rgba(45, 38, 25, 0.9);
    border-color: var(--gold-dim);
    transform: translateY(-3px);
  }
  .rps-score {
    display: flex;
    justify-content: space-around;
    margin-top: 16px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }
  .rps-score .val {
    color: var(--gold-soft);
    font-weight: 700;
  }

  /* Bottom nav */
  .bottom-nav {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 468px;
    background: rgba(20, 17, 12, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 8px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    z-index: 100;
    box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 4px;
    border-radius: 16px;
    text-decoration: none;
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
    transition: all 0.25s ease;
    position: relative;
  }
  .nav-item svg {
    width: 20px; height: 20px;
    stroke: currentColor;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .nav-item:hover {
    color: var(--text);
    background: rgba(35, 30, 22, 0.5);
  }
  .nav-item.active {
    color: var(--gold-soft);
  }
  .nav-item.active::after {
    content: '';
    position: absolute;
    bottom: 2px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold-glow);
  }

  @media (max-width: 380px) {
    .game-tabs { gap: 6px; }
    .game-tab { padding: 8px 12px; font-size: 11px; }
    .rps-choice { width: 80px; height: 80px; font-size: 40px; }
  }
</style>
</head>

<div class="dash-bg"></div>
<div class="dash-overlay"></div>

<div class="wrap">

  <div class="game-header">
    <h1>Game</h1>

      <svg viewBox="0 0 24 24">

        <div class="rps-vs">VS</div>

      <div class="rps-result" id="rpsResult">Pilih senjata lo!</div>
      <div class="rps-buttons">
        <button class="rps-btn" onclick="playRPS('rock')">🪨</button>
        <button class="rps-btn" onclick="playRPS('paper')">📄</button>

<script>
  // ============ SWITCH GAME ============
  function switchGame(id, el) {
    document.querySelectorAll('.game-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.game-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('panel-' + id).classList.add('active');
    if (el) el.classList.add('active');

    // Kalau pindah ke snake, reset
    if (id !== 'snake' && snakeRunning) {
      clearInterval(snakeInterval);
      snakeRunning = false;
      document.getElementById('snakeBtn').textContent = 'Mulai';
    }
  }

  // ============================================================
  // TIC TAC TOE
  // ============================================================
  let tttBoard = ['', '', '', '', '', '', '', '', ''];
  let tttCurrent = 'X';
  let tttMode = 'ai';
  let tttDone = false;

  function renderTTT() {
    const board = document.getElementById('tttBoard');
    board.innerHTML = '';
    tttBoard.forEach((val, i) => {
      const cell = document.createElement('div');
      cell.className = 'ttt-cell';
      if (val) {
        cell.classList.add('taken');
        cell.classList.add(val.toLowerCase());
        cell.textContent = val;
      }
      cell.onclick = () => tttMove(i);
      board.appendChild(cell);
    });
  }

  function setTTTMode(mode) {
    tttMode = mode;
    document.getElementById('modeAI').classList.toggle('active', mode === 'ai');
    document.getElementById('mode2P').classList.toggle('active', mode === '2p');
    resetTTT();
  }

  function tttMove(i) {
    if (tttDone || tttBoard[i]) return;
    if (tttMode === 'ai' && tttCurrent !== 'X') return;

    tttBoard[i] = tttCurrent;
    const win = checkTTTWin();
    if (win) {
      finishTTT(win);
      return;
    }
    if (tttBoard.every(c => c)) {
      finishTTT('draw');
      return;
    }

    tttCurrent = tttCurrent === 'X' ? 'O' : 'X';
    renderTTT();
    document.getElementById('tttStatus').textContent = 'Giliran: ' + tttCurrent;

    if (tttMode === 'ai' && tttCurrent === 'O') {
      setTimeout(aiMove, 400);
    }
  }

  function aiMove() {
    if (tttDone) return;
    // AI simple: coba menang, coba block, ambil tengah, ambil sudut, random
    let move = -1;
    // Cek menang
    for (let i = 0; i < 9; i++) {
      if (!tttBoard[i]) {
        tttBoard[i] = 'O';
        if (checkTTTWin()) { move = i; tttBoard[i] = ''; break; }
        tttBoard[i] = '';
      }
    }
    // Cek block
    if (move === -1) {
      for (let i = 0; i < 9; i++) {
        if (!tttBoard[i]) {
          tttBoard[i] = 'X';
          if (checkTTTWin()) { move = i; tttBoard[i] = ''; break; }
          tttBoard[i] = '';
        }
      }
    }
    // Tengah
    if (move === -1 && !tttBoard[4]) move = 4;
    // Sudut
    if (move === -1) {
      const corners = [0, 2, 6, 8].filter(i => !tttBoard[i]);
      if (corners.length) move = corners[Math.floor(Math.random() * corners.length)];
    }
    // Random
    if (move === -1) {
      const empty = tttBoard.map((v, i) => v ? -1 : i).filter(i => i !== -1);
      if (empty.length) move = empty[Math.floor(Math.random() * empty.length)];
    }

    if (move !== -1) {
      tttBoard[move] = 'O';
      const win = checkTTTWin();
      if (win) { finishTTT(win); return; }
      if (tttBoard.every(c => c)) { finishTTT('draw'); return; }
      tttCurrent = 'X';
      renderTTT();
      document.getElementById('tttStatus').textContent = 'Giliran: X';
    }
  }

  function checkTTTWin() {
    const lines = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];
    for (const line of lines) {
      const [a,b,c] = line;
      if (tttBoard[a] && tttBoard[a] === tttBoard[b] && tttBoard[a] === tttBoard[c]) {
        return { winner: tttBoard[a], line };
      }
    }
    return null;
  }

  function finishTTT(result) {
    tttDone = true;
    if (result === 'draw') {
      document.getElementById('tttStatus').textContent = 'Seri! 🤝';
    } else {
      document.getElementById('tttStatus').textContent = 'Menang: ' + result.winner + ' 🎉';
      // Highlight
      const cells = document.querySelectorAll('.ttt-cell');
      result.line.forEach(i => cells[i].classList.add('win'));
    }
    renderTTT();
    if (result !== 'draw') {
      const cells = document.querySelectorAll('.ttt-cell');
      result.line.forEach(i => cells[i].classList.add('win'));
    }
  }

  function resetTTT() {
    tttBoard = ['', '', '', '', '', '', '', '', ''];
    tttCurrent = 'X';
    tttDone = false;
    document.getElementById('tttStatus').textContent = 'Giliran: X';
    renderTTT();
  }

  renderTTT();

  // ============================================================
  // SNAKE
  // ============================================================
  const snakeCanvas = document.getElementById('snakeCanvas');
  const snakeCtx = snakeCanvas.getContext('2d');
  const SNAKE_SIZE = 16;
  const SNAKE_CELLS = snakeCanvas.width / SNAKE_SIZE;

  let snake = [];
  let snakeDir = { x: 1, y: 0 };
  let snakeNextDir = { x: 1, y: 0 };
  let snakeFood = { x: 0, y: 0 };
  let snakeScore = 0;
  let snakeRunning = false;
  let snakeInterval = null;
  let snakeBest = parseInt(localStorage.getItem('v4l3n_snake_best') || '0');
  document.getElementById('snakeBest').textContent = snakeBest;

  function resetSnake() {
    snake = [{x: 8, y: 8}, {x: 7, y: 8}, {x: 6, y: 8}];
    snakeDir = { x: 1, y: 0 };
    snakeNextDir = { x: 1, y: 0 };
    snakeScore = 0;
    document.getElementById('snakeScore').textContent = 0;
    placeFood();
    drawSnake();
  }

  function placeFood() {
    while (true) {
      const f = {
        x: Math.floor(Math.random() * SNAKE_CELLS),
        y: Math.floor(Math.random() * SNAKE_CELLS)
      };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) {
        snakeFood = f;
        return;
      }
    }
  }

  function drawSnake() {
    snakeCtx.fillStyle = 'rgba(10, 8, 6, 0.85)';
    snakeCtx.fillRect(0, 0, snakeCanvas.width, snakeCanvas.height);

    // Grid
    snakeCtx.strokeStyle = 'rgba(212, 175, 55, 0.05)';
    snakeCtx.lineWidth = 1;
    for (let i = 0; i <= SNAKE_CELLS; i++) {
      snakeCtx.beginPath();
      snakeCtx.moveTo(i * SNAKE_SIZE, 0);
      snakeCtx.lineTo(i * SNAKE_SIZE, snakeCanvas.height);
      snakeCtx.stroke();
      snakeCtx.beginPath();
      snakeCtx.moveTo(0, i * SNAKE_SIZE);
      snakeCtx.lineTo(snakeCanvas.width, i * SNAKE_SIZE);
      snakeCtx.stroke();
    }

    // Food
    snakeCtx.fillStyle = '#ff6666';
    snakeCtx.shadowColor = '#ff6666';
    snakeCtx.shadowBlur = 15;
    snakeCtx.beginPath();
    snakeCtx.arc(
      snakeFood.x * SNAKE_SIZE + SNAKE_SIZE / 2,
      snakeFood.y * SNAKE_SIZE + SNAKE_SIZE / 2,
      SNAKE_SIZE / 2 - 2, 0, Math.PI * 2
    );
    snakeCtx.fill();
    snakeCtx.shadowBlur = 0;

    // Snake
    snake.forEach((seg, i) => {
      const isHead = i === 0;
      snakeCtx.fillStyle = isHead ? '#e8c87a' : '#d4af37';
      snakeCtx.shadowColor = '#d4af37';
      snakeCtx.shadowBlur = isHead ? 15 : 5;
      snakeCtx.beginPath();
      snakeCtx.roundRect(
        seg.x * SNAKE_SIZE + 1,
        seg.y * SNAKE_SIZE + 1,
        SNAKE_SIZE - 2,
        SNAKE_SIZE - 2,
        3
      );
      snakeCtx.fill();
    });
    snakeCtx.shadowBlur = 0;
  }

  function snakeStep() {
    snakeDir = { ...snakeNextDir };
    const head = { x: snake[0].x + snakeDir.x, y: snake[0].y + snakeDir.y };

    // Tabrak dinding
    if (head.x < 0 || head.x >= SNAKE_CELLS || head.y < 0 || head.y >= SNAKE_CELLS) {
      endSnake();
      return;
    }
    // Tabrak badan
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      endSnake();
      return;
    }

    snake.unshift(head);

    // Makan
    if (head.x === snakeFood.x && head.y === snakeFood.y) {
      snakeScore++;
      document.getElementById('snakeScore').textContent = snakeScore;
      placeFood();
    } else {
      snake.pop();
    }

    drawSnake();
  }

  function toggleSnake() {
    if (snakeRunning) {
      clearInterval(snakeInterval);
      snakeRunning = false;
      document.getElementById('snakeBtn').textContent = 'Lanjut';
    } else {
      if (snake.length === 0) resetSnake();
      snakeRunning = true;
      document.getElementById('snakeBtn').textContent = 'Pause';
      snakeInterval = setInterval(snakeStep, 120);
    }
  }

  function endSnake() {
    clearInterval(snakeInterval);
    snakeRunning = false;
    document.getElementById('snakeBtn').textContent = 'Mulai';
    if (snakeScore > snakeBest) {
      snakeBest = snakeScore;
      localStorage.setItem('v4l3n_snake_best', snakeBest);
      document.getElementById('snakeBest').textContent = snakeBest;
    }
    alert('Game Over! Skor: ' + snakeScore);
  }

  // Keyboard
  document.addEventListener('keydown', (e) => {
    const key = e.key;
    if (['ArrowUp', 'w', 'W'].includes(key) && snakeDir.y === 0) snakeNextDir = { x: 0, y: -1 };
    else if (['ArrowDown', 's', 'S'].includes(key) && snakeDir.y === 0) snakeNextDir = { x: 0, y: 1 };
    else if (['ArrowLeft', 'a', 'A'].includes(key) && snakeDir.x === 0) snakeNextDir = { x: -1, y: 0 };
    else if (['ArrowRight', 'd', 'D'].includes(key) && snakeDir.x === 0) snakeNextDir = { x: 1, y: 0 };
  });

  // Swipe
  let touchStart = null;
  snakeCanvas.addEventListener('touchstart', (e) => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  snakeCanvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 30 && snakeDir.x === 0) snakeNextDir = { x: 1, y: 0 };
      else if (dx < -30 && snakeDir.x === 0) snakeNextDir = { x: -1, y: 0 };
    } else {
      if (dy > 30 && snakeDir.y === 0) snakeNextDir = { x: 0, y: 1 };
      else if (dy < -30 && snakeDir.y === 0) snakeNextDir = { x: 0, y: -1 };
    }
    touchStart = null;
  }, { passive: true });

  resetSnake();

  // ============================================================
  // MEMORY MATCH
  // ============================================================
  const memoryEmojis = ['🌸', '⚔️', '🎮', '🍜', '🐉', '🌙', '⭐', '🔥'];
  let memoryCards = [];
  let memoryFlipped = [];
  let memoryMatched = 0;
  let memoryMoves = 0;
  let memoryLock = false;

  function resetMemory() {
    memoryCards = [...memoryEmojis, ...memoryEmojis];
    memoryCards.sort(() => Math.random() - 0.5);
    memoryFlipped = [];
    memoryMatched = 0;
    memoryMoves = 0;
    memoryLock = false;
    document.getElementById('memPairs').textContent = '0';
    document.getElementById('memMoves').textContent = '0';
    renderMemory();
  }

  function renderMemory() {
    const board = document.getElementById('memoryBoard');
    board.innerHTML = '';
    memoryCards.forEach((emoji, i) => {
      const card = document.createElement('div');
      card.className = 'memory-card';
      card.innerHTML = `<span class="front">${emoji}</span><span class="back">?</span>`;
      card.onclick = () => flipMemory(i, card);
      board.appendChild(card);
    });
  }

  function flipMemory(i, card) {
    if (memoryLock) return;
    if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

    card.classList.add('flipped');
    memoryFlipped.push({ i, card, emoji: memoryCards[i] });

    if (memoryFlipped.length === 2) {
      memoryMoves++;
      document.getElementById('memMoves').textContent = memoryMoves;
      memoryLock = true;

      if (memoryFlipped[0].emoji === memoryFlipped[1].emoji) {
        memoryFlipped.forEach(f => f.card.classList.add('matched'));
        memoryMatched++;
        document.getElementById('memPairs').textContent = memoryMatched;
        memoryFlipped = [];
        memoryLock = false;
        if (memoryMatched === 8) {
          setTimeout(() => alert('🎉 Menang! ' + memoryMoves + ' langkah'), 400);
        }
      } else {
        setTimeout(() => {
          memoryFlipped.forEach(f => f.card.classList.remove('flipped'));
          memoryFlipped = [];
          memoryLock = false;
        }, 800);
      }
    }
  }

  resetMemory();

  // ============================================================
  // ROCK PAPER SCISSORS
  // ============================================================
  const rpsEmojis = { rock: '🪨', paper: '📄', scissors: '✂️' };
  let rpsStats = { win: 0, draw: 0, lose: 0 };

  function playRPS(player) {
    const ai = ['rock', 'paper', 'scissors'][Math.floor(Math.random() * 3)];

    document.getElementById('rpsPlayer').textContent = rpsEmojis[player];
    document.getElementById('rpsAI').textContent = rpsEmojis[ai];

    let result = '';
    if (player === ai) {
      result = 'Seri! 🤝';
      rpsStats.draw++;
    } else if (
      (player === 'rock' && ai === 'scissors') ||
      (player === 'paper' && ai === 'rock') ||
      (player === 'scissors' && ai === 'paper')
    ) {
      result = 'Lo menang! 🎉';
      rpsStats.win++;
    } else {
      result = 'Lo kalah 😢';
      rpsStats.lose++;
    }

    document.getElementById('rpsResult').textContent = result;
    document.getElementById('rpsWin').textContent = rpsStats.win;
    document.getElementById('rpsDraw').textContent = rpsStats.draw;
    document.getElementById('rpsLose').textContent = rpsStats.lose;
  }
</script>
