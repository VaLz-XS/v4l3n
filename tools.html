<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tools // v4l3n</title>
<style>
  :root {
    --bg: #0a0a0c;
    --panel: rgba(18, 15, 12, 0.75);
    --panel-solid: rgba(22, 18, 14, 0.95);
    --border: rgba(255, 215, 0, 0.15);
    --gold: #d4af37;
    --gold-soft: #e8c87a;
    --gold-dim: #8a7020;
    --gold-glow: rgba(212, 175, 55, 0.3);
    --text: #ece8e0;
    --muted: #8a8070;
    --font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .dash-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image: url('assets/tenka-bg.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }

  .dash-overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: linear-gradient(180deg,
      rgba(10, 8, 6, 0.65) 0%,
      rgba(10, 8, 6, 0.5) 40%,
      rgba(10, 8, 6, 0.85) 100%);
    pointer-events: none;
  }

  .wrap {
    position: relative;
    z-index: 2;
    max-width: 500px;
    margin: 0 auto;
    padding: 20px 16px 120px;
  }

  /* Header */
  .tools-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .tools-header h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .back-btn {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: rgba(25, 20, 15, 0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: all 0.25s ease;
  }
  .back-btn:hover {
    background: rgba(45, 38, 25, 0.8);
    border-color: var(--gold-dim);
  }
  .back-btn svg {
    width: 20px; height: 20px;
    stroke: var(--text);
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .tools-sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  /* Tool tabs */
  .tool-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 20px;
    scrollbar-width: none;
  }
  .tool-tabs::-webkit-scrollbar { display: none; }
  .tool-tab {
    flex-shrink: 0;
    padding: 10px 16px;
    background: rgba(25, 20, 15, 0.7);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    white-space: nowrap;
  }
  .tool-tab:hover {
    color: var(--text);
    border-color: var(--gold-dim);
  }
  .tool-tab.active {
    background: rgba(212, 175, 55, 0.15);
    color: var(--gold-soft);
    border-color: rgba(212, 175, 55, 0.4);
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
  }

  /* Tool panel */
  .tool-panel {
    display: none;
    animation: fadeIn 0.3s ease;
  }
  .tool-panel.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--panel);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 14px;
  }
  .card h3 {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h3 svg {
    width: 18px; height: 18px;
    stroke: var(--gold-soft);
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Input & button */
  input, textarea, select {
    width: 100%;
    padding: 12px 14px;
    background: rgba(10, 8, 6, 0.7);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 10px;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--gold-dim);
    box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
  }
  input::placeholder, textarea::placeholder { color: var(--muted); }
  textarea { resize: vertical; min-height: 80px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 20px;
    background: linear-gradient(135deg, #d4af37, #e8c87a);
    color: #1a1408;
    border: none;
    border-radius: 10px;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
    width: 100%;
    margin-bottom: 8px;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 25px rgba(212, 175, 55, 0.4);
  }
  .btn-secondary {
    background: rgba(25, 20, 15, 0.8);
    color: var(--text);
    border: 1px solid var(--border);
    box-shadow: none;
  }
  .btn-secondary:hover {
    background: rgba(40, 32, 22, 0.9);
    border-color: var(--gold-dim);
  }

  .result {
    padding: 14px;
    background: rgba(10, 8, 6, 0.6);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--gold-soft);
    word-break: break-all;
    margin-top: 10px;
    min-height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  /* Kalkulator */
  .calc-display {
    background: rgba(10, 8, 6, 0.8);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    text-align: right;
  }
  .calc-display .calc-expr {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    min-height: 16px;
    margin-bottom: 4px;
  }
  .calc-display .calc-result {
    font-family: var(--mono);
    font-size: 28px;
    font-weight: 700;
    color: var(--gold-soft);
    word-break: break-all;
  }
  .calc-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .calc-btn {
    padding: 16px 8px;
    background: rgba(25, 20, 15, 0.8);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .calc-btn:hover {
    background: rgba(45, 38, 25, 0.9);
    border-color: var(--gold-dim);
  }
  .calc-btn:active { transform: scale(0.95); }
  .calc-btn.op {
    background: rgba(212, 175, 55, 0.12);
    color: var(--gold-soft);
    border-color: rgba(212, 175, 55, 0.25);
  }
  .calc-btn.eq {
    background: linear-gradient(135deg, #d4af37, #e8c87a);
    color: #1a1408;
    border: none;
    font-weight: 800;
  }
  .calc-btn.clear {
    background: rgba(255, 80, 80, 0.15);
    color: #ff8888;
    border-color: rgba(255, 80, 80, 0.3);
  }

  /* QR Code */
  .qr-result {
    display: flex;
    justify-content: center;
    padding: 20px;
    background: #fff;
    border-radius: 12px;
    margin-top: 12px;
  }
  .qr-result canvas, .qr-result img {
    display: block;
    max-width: 100%;
  }

  /* Color picker */
  .color-preview {
    width: 100%;
    height: 80px;
    border-radius: 12px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    transition: background 0.3s;
  }
  .color-info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .color-info-item {
    padding: 12px;
    background: rgba(10, 8, 6, 0.6);
    border: 1px solid var(--border);
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .color-info-item:hover {
    border-color: var(--gold-dim);
  }
  .color-info-item .label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .color-info-item .val {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 700;
    color: var(--gold-soft);
  }

  /* Timer */
  .timer-display {
    font-family: var(--mono);
    font-size: 48px;
    font-weight: 700;
    text-align: center;
    color: var(--gold-soft);
    padding: 20px 0;
    text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
    letter-spacing: 2px;
  }
  .timer-inputs {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .timer-inputs input {
    text-align: center;
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 700;
    margin: 0;
  }
  .timer-inputs label {
    display: block;
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  /* Notes */
  .note-item {
    padding: 12px;
    background: rgba(10, 8, 6, 0.6);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .note-text {
    flex: 1;
    font-size: 13px;
    line-height: 1.5;
    word-break: break-word;
  }
  .note-delete {
    background: rgba(255, 80, 80, 0.15);
    border: 1px solid rgba(255, 80, 80, 0.3);
    color: #ff8888;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    font-size: 14px;
    font-weight: 700;
    transition: all 0.2s;
  }
  .note-delete:hover {
    background: rgba(255, 80, 80, 0.3);
  }

  /* Text case */
  .text-case-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  /* Bottom nav */
  .bottom-nav {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 468px;
    background: rgba(20, 17, 12, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 8px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    z-index: 100;
    box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 4px;
    border-radius: 16px;
    text-decoration: none;
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
    transition: all 0.25s ease;
    position: relative;
  }
  .nav-item svg {
    width: 20px; height: 20px;
    stroke: currentColor;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .nav-item:hover {
    color: var(--text);
    background: rgba(35, 30, 22, 0.5);
  }
  .nav-item.active {
    color: var(--gold-soft);
  }
  .nav-item.active::after {
    content: '';
    position: absolute;
    bottom: 2px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold-glow);
  }

  @media (max-width: 380px) {
    .tool-tabs { gap: 6px; }
    .tool-tab { padding: 8px 12px; font-size: 11px; }
  }
</style>
</head>
<body>

<div class="dash-bg"></div>
<div class="dash-overlay"></div>

<div class="wrap">

  <!-- Header -->
  <div class="tools-header">
    <h1>Tools</h1>
    <a class="back-btn" href="/">
      <svg viewBox="0 0 24 24">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
    </a>
  </div>
  <div class="tools-sub">Kumpulan tools praktis — gratis, tanpa server.</div>

  <!-- Tabs -->
  <div class="tool-tabs">
    <button class="tool-tab active" onclick="switchTool('calc', this)">Kalkulator</button>
    <button class="tool-tab" onclick="switchTool('qr', this)">QR Code</button>
    <button class="tool-tab" onclick="switchTool('pass', this)">Password</button>
    <button class="tool-tab" onclick="switchTool('unit', this)">Konverter</button>
    <button class="tool-tab" onclick="switchTool('timer', this)">Timer</button>
    <button class="tool-tab" onclick="switchTool('notes', this)">Catatan</button>
    <button class="tool-tab" onclick="switchTool('color', this)">Warna</button>
    <button class="tool-tab" onclick="switchTool('case', this)">Teks</button>
  </div>

  <!-- ============ KALKULATOR ============ -->
  <div class="tool-panel active" id="panel-calc">
    <div class="card">
      <div class="calc-display">
        <div class="calc-expr" id="calcExpr">&nbsp;</div>
        <div class="calc-result" id="calcResult">0</div>
      </div>
      <div class="calc-buttons">
        <button class="calc-btn clear" onclick="calcClear()">AC</button>
        <button class="calc-btn op" onclick="calcDel()">⌫</button>
        <button class="calc-btn op" onclick="calcInput('%')">%</button>
        <button class="calc-btn op" onclick="calcInput('/')">÷</button>

        <button class="calc-btn" onclick="calcInput('7')">7</button>
        <button class="calc-btn" onclick="calcInput('8')">8</button>
        <button class="calc-btn" onclick="calcInput('9')">9</button>
        <button class="calc-btn op" onclick="calcInput('*')">×</button>

        <button class="calc-btn" onclick="calcInput('4')">4</button>
        <button class="calc-btn" onclick="calcInput('5')">5</button>
        <button class="calc-btn" onclick="calcInput('6')">6</button>
        <button class="calc-btn op" onclick="calcInput('-')">−</button>

        <button class="calc-btn" onclick="calcInput('1')">1</button>
        <button class="calc-btn" onclick="calcInput('2')">2</button>
        <button class="calc-btn" onclick="calcInput('3')">3</button>
        <button class="calc-btn op" onclick="calcInput('+')">+</button>

        <button class="calc-btn" onclick="calcInput('0')" style="grid-column: span 2;">0</button>
        <button class="calc-btn" onclick="calcInput('.')">.</button>
        <button class="calc-btn eq" onclick="calcEqual()">=</button>
      </div>
    </div>
  </div>

  <!-- ============ QR CODE ============ -->
  <div class="tool-panel" id="panel-qr">
    <div class="card">
      <h3>
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
        </svg>
        QR Code Generator
      </h3>
      <input type="text" id="qrInput" placeholder="Masukkan teks atau link..." />
      <button class="btn" onclick="generateQR()">Generate QR</button>
      <div class="qr-result" id="qrResult" style="display:none;">
        <canvas id="qrCanvas"></canvas>
      </div>
    </div>
  </div>

  <!-- ============ PASSWORD ============ -->
  <div class="tool-panel" id="panel-pass">
    <div class="card">
      <h3>
        <svg viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Generator Password
      </h3>
      <input type="number" id="passLength" value="16" min="4" max="64" placeholder="Panjang password (4-64)" />
      <div class="text-case-buttons" style="margin-bottom: 10px;">
        <button class="btn btn-secondary" onclick="togglePassOpt('upper', this)">A-Z</button>
        <button class="btn btn-secondary" onclick="togglePassOpt('lower', this)">a-z</button>
        <button class="btn btn-secondary" onclick="togglePassOpt('num', this)">0-9</button>
        <button class="btn btn-secondary" onclick="togglePassOpt('sym', this)">!@#</button>
      </div>
      <button class="btn" onclick="generatePassword()">Generate Password</button>
      <div class="result" id="passResult">Klik generate</div>
      <button class="btn btn-secondary" onclick="copyText('passResult')">Copy</button>
    </div>
  </div>

  <!-- ============ KONVERTER ============ -->
  <div class="tool-panel" id="panel-unit">
    <div class="card">
      <h3>
        <svg viewBox="0 0 24 24">
          <path d="M3 12h18M12 3v18"/>
        </svg>
        Konverter Satuan
      </h3>
      <select id="unitType" onchange="updateUnitOptions()">
        <option value="length">Panjang</option>
        <option value="weight">Berat</option>
        <option value="temp">Suhu</option>
      </select>
      <input type="number" id="unitInput" placeholder="Nilai..." value="1" />
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <select id="unitFrom"></select>
        <select id="unitTo"></select>
      </div>
      <button class="btn" onclick="convertUnit()">Konversi</button>
      <div class="result" id="unitResult">Hasil muncul di sini</div>
    </div>
  </div>

  <!-- ============ TIMER ============ -->
  <div class="tool-panel" id="panel-timer">
    <div class="card">
      <h3>
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        Timer
      </h3>
      <div class="timer-display" id="timerDisplay">00:00:00</div>
      <div class="timer-inputs">
        <div>
          <label>Jam</label>
          <input type="number" id="timerH" value="0" min="0" max="99" />
        </div>
        <div>
          <label>Menit</label>
          <input type="number" id="timerM" value="5" min="0" max="59" />
        </div>
        <div>
          <label>Detik</label>
          <input type="number" id="timerS" value="0" min="0" max="59" />
        </div>
      </div>
      <button class="btn" id="timerBtn" onclick="toggleTimer()">Mulai</button>
      <button class="btn btn-secondary" onclick="resetTimer()">Reset</button>
    </div>
  </div>

  <!-- ============ CATATAN ============ -->
  <div class="tool-panel" id="panel-notes">
    <div class="card">
      <h3>
        <svg viewBox="0 0 24 24">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        Catatan Cepat
      </h3>
      <textarea id="noteInput" placeholder="Tulis catatan..."></textarea>
      <button class="btn" onclick="addNote()">Tambah Catatan</button>
      <div id="notesList"></div>
    </div>
  </div>

  <!-- ============ COLOR PICKER ============ -->
  <div class="tool-panel" id="panel-color">
    <div class="card">
      <h3>
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="4"/>
        </svg>
        Pemilih Warna
      </h3>
      <input type="color" id="colorInput" value="#d4af37" onchange="updateColor()" oninput="updateColor()" style="height: 60px; padding: 4px; cursor: pointer;" />
      <div class="color-preview" id="colorPreview" style="background: #d4af37;"></div>
      <div class="color-info">
        <div class="color-info-item" onclick="copyText('colorHex')">
          <div class="label">HEX</div>
          <div class="val" id="colorHex">#D4AF37</div>
        </div>
        <div class="color-info-item" onclick="copyText('colorRgb')">
          <div class="label">RGB</div>
          <div class="val" id="colorRgb">212, 175, 55</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ TEXT CASE ============ -->
  <div class="tool-panel" id="panel-case">
    <div class="card">
      <h3>
        <svg viewBox="0 0 24 24">
          <polyline points="4 7 4 4 20 4 20 7"/>
          <line x1="9" y1="20" x2="15" y2="20"/>
          <line x1="12" y1="4" x2="12" y2="20"/>
        </svg>
        Text Case Converter
      </h3>
      <textarea id="caseInput" placeholder="Tulis teks di sini..."></textarea>
      <div class="text-case-buttons">
        <button class="btn btn-secondary" onclick="convertCase('upper')">UPPERCASE</button>
        <button class="btn btn-secondary" onclick="convertCase('lower')">lowercase</button>
        <button class="btn btn-secondary" onclick="convertCase('title')">Title Case</button>
        <button class="btn btn-secondary" onclick="convertCase('sentence')">Sentence case</button>
      </div>
      <div class="result" id="caseResult">Hasil muncul di sini</div>
      <button class="btn btn-secondary" onclick="copyText('caseResult')">Copy</button>
    </div>
  </div>

</div>

<!-- Bottom nav -->
<nav class="bottom-nav">
  <a class="nav-item" href="/">
    <svg viewBox="0 0 24 24">

<script>
  // ============ SWITCH TOOL ============
  function switchTool(id, el) {
    document.querySelectorAll('.tool-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tool-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('panel-' + id).classList.add('active');
    if (el) el.classList.add('active');
  }

  // ============ COPY HELPER ============
  function copyText(elementId) {
    const el = document.getElementById(elementId);
    if (!el) return;
    const text = el.textContent || el.value;
    navigator.clipboard.writeText(text).then(() => {
      const old = el.textContent;
      el.textContent = '✓ Copied!';
      setTimeout(() => { el.textContent = old; }, 1000);
    }).catch(() => {
      alert('Gagal copy: ' + text);
    });
  }

  // ============ KALKULATOR ============
  let calcCurrent = '';
  let calcPrevious = '';
  let calcOp = null;

  function updateCalcDisplay() {
    document.getElementById('calcExpr').textContent = calcPrevious + ' ' + (calcOp || '');
    document.getElementById('calcResult').textContent = calcCurrent || '0';
  }

  function calcInput(val) {
    if (val === '.' && calcCurrent.includes('.')) return;
    calcCurrent += val;
    updateCalcDisplay();
  }

  function calcInputOp(op) {
    if (calcCurrent === '') return;
    if (calcPrevious !== '' && calcOp) calcEqual();
    calcPrevious = calcCurrent;
    calcCurrent = '';
    calcOp = op;
    updateCalcDisplay();
  }

  function calcClear() {
    calcCurrent = '';
    calcPrevious = '';
    calcOp = null;
    updateCalcDisplay();
  }

  function calcDel() {
    calcCurrent = calcCurrent.slice(0, -1);
    updateCalcDisplay();
  }

  function calcEqual() {
    if (calcCurrent === '' || calcPrevious === '' || !calcOp) return;
    const a = parseFloat(calcPrevious);
    const b = parseFloat(calcCurrent);
    let res = 0;
    switch(calcOp) {
      case '+': res = a + b; break;
      case '-': res = a - b; break;
      case '*': res = a * b; break;
      case '/': res = b !== 0 ? a / b : 'Error'; break;
      case '%': res = a % b; break;
    }
    calcCurrent = String(res);
    calcPrevious = '';
    calcOp = null;
    updateCalcDisplay();
  }

  // Override calcInput buat operator
  const originalCalcInput = calcInput;
  calcInput = function(val) {
    if (['+', '-', '*', '/', '%'].includes(val)) {
      calcInputOp(val);
    } else {
      originalCalcInput(val);
    }
  };

  // ============ QR CODE (pakai API gratis) ============
  function generateQR() {
    const input = document.getElementById('qrInput').value.trim();
    if (!input) { alert('Masukkan teks dulu'); return; }
    const result = document.getElementById('qrResult');
    const canvas = document.getElementById('qrCanvas');
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      result.style.display = 'flex';
    };
    img.onerror = () => {
      alert('Gagal generate QR. Cek koneksi internet.');
    };
    img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(input);
  }

  // ============ PASSWORD ============
  const passOpts = { upper: true, lower: true, num: true, sym: true };

  function togglePassOpt(key, btn) {
    passOpts[key] = !passOpts[key];
    btn.style.opacity = passOpts[key] ? '1' : '0.4';
  }

  function generatePassword() {
    const length = parseInt(document.getElementById('passLength').value) || 16;
    let chars = '';
    if (passOpts.upper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    if (passOpts.lower) chars += 'abcdefghijklmnopqrstuvwxyz';
    if (passOpts.num) chars += '0123456789';
    if (passOpts.sym) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
    if (!chars) { alert('Pilih minimal 1 opsi karakter'); return; }
    let pass = '';
    for (let i = 0; i < length; i++) {
      pass += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    document.getElementById('passResult').textContent = pass;
  }

  // ============ KONVERTER ============
  const unitData = {
    length: {
      m: 1, km: 1000, cm: 0.01, mm: 0.001, inch: 0.0254, ft: 0.3048, mile: 1609.34
    },
    weight: {
      kg: 1, g: 0.001, mg: 0.000001, ton: 1000, lb: 0.453592, oz: 0.0283495
    },
    temp: {
      celsius: 'C', fahrenheit: 'F', kelvin: 'K'
    }
  };

  function updateUnitOptions() {
    const type = document.getElementById('unitType').value;
    const from = document.getElementById('unitFrom');
    const to = document.getElementById('unitTo');
    from.innerHTML = '';
    to.innerHTML = '';
    if (type === 'temp') {
      ['celsius', 'fahrenheit', 'kelvin'].forEach(u => {
        from.innerHTML += `<option value="${u}">${u}</option>`;
        to.innerHTML += `<option value="${u}">${u}</option>`;
      });
      to.value = 'fahrenheit';
    } else {
      Object.keys(unitData[type]).forEach(u => {
        from.innerHTML += `<option value="${u}">${u}</option>`;
        to.innerHTML += `<option value="${u}">${u}</option>`;
      });
    }
  }

  function convertUnit() {
    const type = document.getElementById('unitType').value;
    const val = parseFloat(document.getElementById('unitInput').value);
    const from = document.getElementById('unitFrom').value;
    const to = document.getElementById('unitTo').value;
    if (isNaN(val)) { document.getElementById('unitResult').textContent = 'Masukkan nilai valid'; return; }

    let result;
    if (type === 'temp') {
      let c;
      if (from === 'celsius') c = val;
      else if (from === 'fahrenheit') c = (val - 32) * 5/9;
      else c = val - 273.15;
      if (to === 'celsius') result = c;
      else if (to === 'fahrenheit') result = c * 9/5 + 32;
      else result = c + 273.15;
    } else {
      const base = val * unitData[type][from];
      result = base / unitData[type][to];
    }

    document.getElementById('unitResult').textContent = result.toFixed(4).replace(/\.?0+$/, '') + ' ' + to;
  }

  updateUnitOptions();

  // ============ TIMER ============
  let timerInterval = null;
  let timerSeconds = 0;
  let timerRunning = false;

  function updateTimerDisplay() {
    const h = Math.floor(timerSeconds / 3600);
    const m = Math.floor((timerSeconds % 3600) / 60);
    const s = timerSeconds % 60;
    document.getElementById('timerDisplay').textContent =
      String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function toggleTimer() {
    const btn = document.getElementById('timerBtn');
    if (timerRunning) {
      clearInterval(timerInterval);
      timerRunning = false;
      btn.textContent = 'Lanjut';
    } else {
      if (timerSeconds === 0) {
        const h = parseInt(document.getElementById('timerH').value) || 0;
        const m = parseInt(document.getElementById('timerM').value) || 0;
        const s = parseInt(document.getElementById('timerS').value) || 0;
        timerSeconds = h * 3600 + m * 60 + s;
      }
      if (timerSeconds <= 0) { alert('Set waktu dulu'); return; }
      timerRunning = true;
      btn.textContent = 'Pause';
      timerInterval = setInterval(() => {
        timerSeconds--;
        updateTimerDisplay();
        if (timerSeconds <= 0) {
          clearInterval(timerInterval);
          timerRunning = false;
          btn.textContent = 'Mulai';
          updateTimerDisplay();
          // Notif
          if (Notification.permission === 'granted') {
            new Notification('⏰ Timer selesai!');
          } else if (Notification.permission !== 'denied') {
            Notification.requestPermission().then(p => {
              if (p === 'granted') new Notification('⏰ Timer selesai!');
            });
          }
          alert('⏰ Timer selesai!');
        }
      }, 1000);
    }
  }

  function resetTimer() {
    clearInterval(timerInterval);
    timerRunning = false;
    timerSeconds = 0;
    document.getElementById('timerBtn').textContent = 'Mulai';
    updateTimerDisplay();
  }

  // ============ CATATAN ============
  let notes = JSON.parse(localStorage.getItem('v4l3n_notes') || '[]');

  function renderNotes() {
    const list = document.getElementById('notesList');
    list.innerHTML = '';
    notes.forEach((note, i) => {
      const div = document.createElement('div');
      div.className = 'note-item';
      div.innerHTML = `
        <div class="note-text">${escapeHtml(note)}</div>
        <div class="note-delete" onclick="deleteNote(${i})">×</div>
      `;
      list.appendChild(div);
    });
  }

  function addNote() {
    const input = document.getElementById('noteInput');
    const text = input.value.trim();
    if (!text) return;
    notes.unshift(text);
    localStorage.setItem('v4l3n_notes', JSON.stringify(notes));
    input.value = '';
    renderNotes();
  }

  function deleteNote(i) {
    notes.splice(i, 1);
    localStorage.setItem('v4l3n_notes', JSON.stringify(notes));
    renderNotes();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  renderNotes();

  // ============ COLOR PICKER ============
  function updateColor() {
    const color = document.getElementById('colorInput').value;
    document.getElementById('colorPreview').style.background = color;
    document.getElementById('colorHex').textContent = color.toUpperCase();
    const r = parseInt(color.slice(1, 3), 16);
    const g = parseInt(color.slice(3, 5), 16);
    const b = parseInt(color.slice(5, 7), 16);
    document.getElementById('colorRgb').textContent = `${r}, ${g}, ${b}`;
  }

  // ============ TEXT CASE ============
  function convertCase(type) {
    const input = document.getElementById('caseInput').value;
    let result = '';
    switch(type) {
      case 'upper': result = input.toUpperCase(); break;
      case 'lower': result = input.toLowerCase(); break;
      case 'title': result = input.replace(/\w\S*/g, t => t.charAt(0).toUpperCase() + t.substr(1).toLowerCase()); break;
      case 'sentence': result = input.charAt(0).toUpperCase() + input.slice(1).toLowerCase(); break;
    }
    document.getElementById('caseResult').textContent = result;
  }

  // Init
  updateCalcDisplay();
  updateColor();
</script>

</body>
