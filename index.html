<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>v4l3n // Dashboard</title>
<style>
  :root {
    --bg: #0a0a0c;
    --panel: rgba(18, 15, 12, 0.75);
    --border: rgba(255, 215, 0, 0.15);
    --gold: #d4af37;
    --gold-soft: #e8c87a;
    --gold-dim: #8a7020;
    --gold-glow: rgba(212, 175, 55, 0.3);
    --text: #ece8e0;
    --muted: #8a8070;
    --font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
  }

  /* ============ LOADING SCREEN (VIDEO tenka-bg.mp4) ============ */
  #loader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: opacity 0.8s ease, visibility 0.8s;
  }
  #loader.hide {
    opacity: 0;
    visibility: hidden;
  }

  .loader-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    opacity: 0;
    animation: fadeInBg 1.5s ease forwards;
    animation-delay: 0.3s;
  }
  @keyframes fadeInBg { to { opacity: 1; } }

  .loader-overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(180deg,
      rgba(10, 10, 12, 0.25) 0%,
      rgba(10, 10, 12, 0.35) 30%,
      rgba(10, 10, 12, 0.75) 60%,
      rgba(10, 10, 12, 0.95) 100%);
    pointer-events: none;
  }

  .loader-content {
    position: relative;
    z-index: 3;
    margin-top: auto;
    width: 100%;
    padding: 24px;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding-bottom: 40px;
  }

  .loader-inner {
    width: 100%;
    max-width: 420px;
    opacity: 0;
    animation: fadeInUp 1.2s ease forwards;
    animation-delay: 1.2s;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .loader-title {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 5px;
    color: var(--gold-soft);
    margin-bottom: 16px;
    text-transform: uppercase;
    font-weight: 700;
    text-align: center;
    text-shadow: 0 0 15px var(--gold-glow);
  }

  .welcome-panel {
    background: rgba(15, 12, 10, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 26px;
    margin-bottom: 18px;
    box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
    position: relative;
    overflow: hidden;
  }
  .welcome-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: linear-gradient(180deg, var(--gold), var(--gold-soft));
    box-shadow: 0 0 15px var(--gold-glow);
  }
  .welcome-panel p {
    color: var(--text);
    font-size: 14px;
    line-height: 1.75;
  }
  .welcome-panel .highlight {
    color: var(--gold-soft);
    font-weight: 700;
  }

  .loader-btn {
    display: block;
    width: 100%;
    padding: 16px 24px;
    background: linear-gradient(135deg, #d4af37 0%, #e8c87a 100%);
    color: #1a1408;
    border: none;
    border-radius: 14px;
    font-family: var(--font);
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(212, 175, 55, 0.3);
    transition: all 0.3s ease;
  }
  .loader-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 45px rgba(212, 175, 55, 0.5);
  }

  .loader-progress {
    width: 100%;
    height: 3px;
    background: rgba(255, 215, 0, 0.12);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 18px;
  }
  .loader-progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--gold), var(--gold-soft));
    box-shadow: 0 0 15px var(--gold-glow);
    transition: width 0.2s linear;
  }
  .loader-percent {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    margin-top: 10px;
    text-align: center;
  }

  /* ============ DASHBOARD ============ */
  #dashboard {
    position: fixed;
    inset: 0;
    display: none;
    overflow-y: auto;
    overflow-x: hidden;
    z-index: 1;
  }
  #dashboard.show { display: block; }

  /* Background tenka-bg.jpg — JANGAN DIUBAH */
  .dash-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image: url('assets/tenka-bg.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }

  .dash-overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: linear-gradient(180deg,
      rgba(10, 8, 6, 0.6) 0%,
      rgba(10, 8, 6, 0.45) 40%,
      rgba(10, 8, 6, 0.8) 100%);
    pointer-events: none;
  }

  .dash-wrap {
    position: relative;
    z-index: 2;
    max-width: 460px;
    margin: 0 auto;
    padding: 20px 16px 120px;
  }

  /* Top bar */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .icon-btn {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: rgba(25, 20, 15, 0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .icon-btn:hover {
    background: rgba(45, 38, 25, 0.8);
    border-color: var(--gold-dim);
  }
  .icon-btn svg {
    width: 20px; height: 20px;
    stroke: var(--text);
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Hero card — video tenka-v.mp4 */
  .hero-card {
    position: relative;
    width: 100%;
    aspect-ratio: 16/10;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 18px;
    border: 1px solid var(--border);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    background: #14100a;
  }
  .hero-card video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .hero-card .hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 50%, rgba(10, 8, 6, 0.7) 100%);
    pointer-events: none;
  }
  .hero-card .hero-character {
    position: absolute;
    bottom: 0;
    right: 8px;
    width: 70px;
    height: auto;
    filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4));
    pointer-events: none;
    z-index: 2;
  }

  /* Profile card */
  .profile-card {
    background: var(--panel);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 16px;
  }

  .profile-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .profile-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #d4af37, #e8c87a);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 18px;
    color: #1a1408;
    flex-shrink: 0;
    box-shadow: 0 0 20px var(--gold-glow);
  }
  .profile-info {
    flex: 1;
    min-width: 0;
  }
  .profile-name {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .profile-level {
    display: inline-block;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    background: rgba(212, 175, 55, 0.15);
    color: var(--gold-soft);
    border: 1px solid rgba(212, 175, 55, 0.3);
    border-radius: 6px;
    letter-spacing: 0.5px;
  }
  .profile-actions {
    display: flex;
    gap: 8px;
  }
  .profile-actions .icon-btn {
    width: 38px;
    height: 38px;
  }
  .profile-actions .icon-btn svg {
    width: 18px; height: 18px;
  }
  .profile-progress {
    width: 100%;
    height: 3px;
    background: rgba(255, 215, 0, 0.12);
    border-radius: 2px;
    overflow: hidden;
  }
  .profile-progress-fill {
    height: 100%;
    width: 35%;
    background: linear-gradient(90deg, var(--gold), var(--gold-soft));
    box-shadow: 0 0 10px var(--gold-glow);
  }

  /* Tombol Spotify */
  .spotify-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px;
    background: rgba(25, 22, 18, 0.7);
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--text);
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 16px;
    transition: all 0.25s ease;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .spotify-btn:hover {
    background: rgba(40, 35, 25, 0.8);
    border-color: var(--gold-dim);
    transform: translateY(-2px);
  }
  .spotify-btn svg {
    width: 20px; height: 20px;
    stroke: var(--gold-soft);
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Statistik */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .stat-box {
    background: var(--panel);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    flex-direction: column;
  }
  .stat-box svg {
    width: 14px; height: 14px;
    stroke: var(--gold-soft);
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .stat-box .stat-val {
    color: var(--text);
    font-weight: 700;
    font-size: 11px;
  }

  /* Action grid */
  .action-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .action-btn {
    background: var(--panel);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    transition: all 0.25s ease;
    text-align: left;
  }
  .action-btn:hover {
    background: rgba(35, 30, 22, 0.8);
    border-color: var(--gold-dim);
    transform: translateY(-2px);
  }
  .action-btn svg {
    width: 22px; height: 22px;
    stroke: var(--gold-soft);
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }

  /* Bottom nav */
  .bottom-nav {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 428px;
    background: rgba(20, 17, 12, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 8px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    z-index: 100;
    box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 4px;
    border-radius: 16px;
    text-decoration: none;
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
    transition: all 0.25s ease;
    position: relative;
  }
  .nav-item svg {
    width: 20px; height: 20px;
    stroke: currentColor;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .nav-item:hover {
    color: var(--text);
    background: rgba(35, 30, 22, 0.5);
  }
  .nav-item.active {
    color: var(--gold-soft);
  }
  .nav-item.active::after {
    content: '';
    position: absolute;
    bottom: 2px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold-glow);
  }

  /* Partikel */
  .particles {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    width: 2px;
    height: 2px;
    background: radial-gradient(circle, #e8c87a, #d4af37);
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
    opacity: 0;
    animation: rise linear infinite;
  }
  @keyframes rise {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.8; }
    100% { transform: translateY(-100vh) translateX(30px); opacity: 0; }
  }

  @media (max-width: 380px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>

<!-- LOADING SCREEN (VIDEO) -->

    </a>

      <svg viewBox="0 0 24 24">
        <polyline points="16 18 22 12 16 6"/>
        <polyline points="8 6 2 12 8 18"/>
      </svg>
      <span>Dev</span>
    </a>
    <a class="nav-item" href="/tools.html">
      <svg viewBox="0 0 24 24">
        <path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-2.4 2.6-2.6z"/>
      </svg>
      <span>Tools</span>
    </a>
  </nav>

</div>

<script>
  function createParticles(containerId, count) {
    const c = document.getElementById(containerId);
    if (!c) return;
    c.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.bottom = '-10px';
      p.style.animationDuration = (6 + Math.random() * 8) + 's';
      p.style.animationDelay = (Math.random() * 8) + 's';
      c.appendChild(p);
    }
  }
  createParticles('loaderParticles', 18);
  createParticles('dashParticles', 12);

  (function() {
    const fill = document.getElementById('loaderFill');
    const percent = document.getElementById('loaderPercent');
    let p = 0;
    const interval = setInterval(() => {
      let inc = p < 70 ? Math.random() * 5 + 2 : Math.random() * 15 + 5;
      p += inc;
      if (p >= 100) {
        p = 100;
        fill.style.width = '100%';
        percent.textContent = '100% — SIAP!';
        clearInterval(interval);
      } else {
        fill.style.width = p + '%';
        percent.textContent = Math.floor(p) + '%';
      }
    }, 200);
  })();

  function goToDashboard() {
    document.getElementById('loader').classList.add('hide');
    document.getElementById('dashboard').classList.add('show');
    window.scrollTo(0, 0);
    updateAll();
  }

  function updateClock() {
    const now = new Date();
    const t = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('statTime').textContent = t;
    document.getElementById('statClock').textContent = t;
  }

  function updateBattery() {
    if (navigator.getBattery) {
      navigator.getBattery().then(b => {
        document.getElementById('statBattery').textContent = Math.round(b.level * 100) + '%';
      });
    } else {
      document.getElementById('statBattery').textContent = '--%';
    }
  }

  async function updateWeather() {
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=-6.2088&longitude=106.8456&current=temperature_2m&timezone=Asia/Jakarta`;
      const res = await fetch(url);
      const data = await res.json();
      document.getElementById('statWeather').textContent = Math.round(data.current.temperature_2m) + '°';
    } catch {
      document.getElementById('statWeather').textContent = '--°';
    }
  }

  function updateAll() {
    updateClock();
    setInterval(updateClock, 1000);
    updateBattery();
    updateWeather();
  }
</script>

</body>
</html>
